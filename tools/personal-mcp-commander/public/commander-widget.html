<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LudoMada Commander</title><style>body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#0b1220;color:#eef3ff}main{max-width:680px;margin:auto;padding:18px}section{background:#121b2e;border:1px solid #263451;border-radius:16px;padding:16px;margin-bottom:12px}h1{font-size:20px;margin:0 0 4px}small{color:#9fb0cf}.row{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:7px 10px;border-radius:999px;background:#1b2a45;font-size:12px}.btn{border:0;border-radius:10px;padding:10px 12px;background:#2b5cff;color:#fff;font-weight:600}.out{white-space:pre-wrap;font:12px ui-monospace,monospace;color:#cfe0ff;max-height:280px;overflow:auto}.ok{color:#75e3a4}</style></head><body><main><section><h1>⚙️ LudoMada Commander</h1><small>Termux / Android development control inside ChatGPT</small><div class="row" style="margin-top:12px"><span class="pill" id="platform">Commander</span><span class="pill">MCP App</span><span class="pill">Write-enabled</span></div></section><section><div class="row"><button class="btn" data-tool="commander_status">Status</button><button class="btn" data-tool="find_projects">Projects</button><button class="btn" data-tool="ludomada_health">LudoMada Health</button></div></section><section><div class="out" id="out">Ready. Ask ChatGPT to inspect, test, build, or modify your project.</div></section></main><script>(function(){const out=document.getElementById('out');function render(x){try{out.textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}catch{out.textContent=String(x)}}async function callTool(name,args={}){if(window.openai&&typeof window.openai.callTool==='function'){render(await window.openai.callTool(name,args));return}render('ChatGPT tool bridge unavailable in this host. Use the tool from the conversation.')};document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>callTool(b.dataset.tool,{}));if(window.openai&&window.openai.toolOutput)render(window.openai.toolOutput);if(window.openai&&window.openai.toolInput&&window.openai.toolInput.name)document.getElementById('platform').textContent='Tool: '+window.openai.toolInput.name})();</script></body></html>
