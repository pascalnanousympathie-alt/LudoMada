services:
  api:
    build: .
    environment:
      NODE_ENV: staging
      DATABASE_URL: postgresql://ludomada:ludomada@postgres:5432/ludomada
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ludomada
      POSTGRES_PASSWORD: ludomada
      POSTGRES_DB: ludomada
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ludomada -d ludomada"]
      interval: 5s
      timeout: 5s
      retries: 20
