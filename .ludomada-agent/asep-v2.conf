# LM-ASEP V2 autonomous control plane
PROJECT="$HOME/LudoMada"
BASE="$PROJECT/.ludomada-agent"
STATE_DIR="$BASE/state"
LOG_DIR="$BASE/logs"
BROWSER_DIR="$BASE/browser"
CDP_URL="http://127.0.0.1:9222"
CHROMIUM_BIN="/data/data/com.termux/files/usr/lib/chromium/chrome"
CDP_PROFILE="$HOME/.cache/ludomada-cdp"
LOOP_INTERVAL=300
WORKER_TIMEOUT=900
MAX_RETRIES=3
WAKE_LOCK=1
AUTO_GIT=1
AUTO_PUSH=1

# Credentials are read only from the process environment or user-owned secret files.
# No secrets are written to state/log files.
RAILWAY_SECRET_FILE="${LUDOMADA_RAILWAY_TOKEN_FILE:-$HOME/.config/ludomada/railway-token}"
