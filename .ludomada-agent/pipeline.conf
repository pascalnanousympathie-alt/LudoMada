# LudoMada Autonomous Pipeline configuration
PROJECT="$HOME/LudoMada"
STATE_DIR="$PROJECT/.ludomada-agent/state"
LOG_DIR="$PROJECT/.ludomada-agent/logs"
LOCK_FILE="$STATE_DIR/pipeline.lock"
HEALTH_FILE="$STATE_DIR/health"
MAX_RETRIES=3
TASK_TIMEOUT=900
SCHEDULER_INTERVAL=300
SUPERVISOR_INTERVAL=30

# Safe verification stages. Secrets and .env files are never read by this pipeline.
STAGES=(git diff-check build test security-test integration-test concurrency-test)

# Autonomous release mode: a single run may live up to 11 hours.
RELEASE_MAX_RUNTIME=39600
RELEASE_MODE=until-final-release-or-blocked
