name: Lane F Premium Visual Gate

on:
  workflow_dispatch:
  push:
    branches:
      - feat/google-signin-real
    paths:
      - "android-app/**"
      - "scripts/audit-material-calibration.mjs"
      - "scripts/check-3d-assets.mjs"
      - "scripts/ramus-smoke.mjs"
      - "scripts/check-ramus-wallet-hitbox.mjs"
      - ".github/workflows/lane-f-premium-gate.yml"
  pull_request:
    paths:
      - "android-app/**"
      - "scripts/audit-material-calibration.mjs"
      - "scripts/check-3d-assets.mjs"
      - "scripts/ramus-smoke.mjs"
      - "scripts/check-ramus-wallet-hitbox.mjs"
      - ".github/workflows/lane-f-premium-gate.yml"

permissions:
  contents: read

jobs:
  premium-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: ludomada-lane-f-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      RELEASE_MAX_RUNTIME: "39600"
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          clean: true
          path: _runs/${{ github.run_id }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Strict premium source gate
        working-directory: ${{ github.workspace }}/_runs/${{ github.run_id }}
        run: |
          set -eu
          node scripts/audit-material-calibration.mjs --strict
          node scripts/check-3d-assets.mjs
          node scripts/check-glb-runtime-transform.mjs
          node scripts/check-ramus-wallet-hitbox.mjs

      - name: Configure Android SDK
        working-directory: ${{ github.workspace }}/_runs/${{ github.run_id }}/android-app
        run: printf "sdk.dir=%s\n" "$ANDROID_HOME" > local.properties

      - name: Build debug APK
        working-directory: ${{ github.workspace }}/_runs/${{ github.run_id }}/android-app
        env:
          REOWN_PROJECT_ID: ${{ secrets.REOWN_PROJECT_ID }}
        run: |
          set -eu
          chmod +x gradlew
          ./gradlew -PREOWN_PROJECT_ID="$REOWN_PROJECT_ID" --no-daemon --no-parallel -Dorg.gradle.workers.max=2 assembleDebug --console=plain --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Verify calibrated 3D asset is packaged in APK
        working-directory: ${{ github.workspace }}/_runs/${{ github.run_id }}
        run: node scripts/check-apk-3d-asset.mjs android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Install Ramus CLI
        working-directory: ${{ github.workspace }}/_runs/${{ github.run_id }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/ramus-cli"
          cp "$GITHUB_WORKSPACE/_runs/$GITHUB_RUN_ID/ci/vendor/ramus-cli-0.1.13.tgz" "$RUNNER_TEMP/ramus-cli/ramus-cli.tgz"
          printf '%s  %s\n' "ae8e1ae1a0f60c066802cd38a0d49d2a793db9cfc01fb2e9db0f2abaaf8d74f9" "$RUNNER_TEMP/ramus-cli/ramus-cli.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/ramus-cli/ramus-cli.tgz" -C "$RUNNER_TEMP/ramus-cli"
          test -f "$RUNNER_TEMP/ramus-cli/package/dist/main.js"
          echo "RAMUS_CLI=$RUNNER_TEMP/ramus-cli/package/dist/main.js" >> "$GITHUB_ENV"

      - name: Ramus visual and interaction smoke
        working-directory: ${{ github.workspace }}/_runs/${{ github.run_id }}
        env:
          RAMUS_APK: ${{ github.workspace }}/_runs/${{ github.run_id }}/android-app/app/build/outputs/apk/debug/app-debug.apk
          RAMUS_API_KEY: ${{ secrets.RAMUS_API_KEY }}
          RAMUS_CAPTURE: "1"
        run: |
          set -o pipefail
          timeout -k 10s 900s node scripts/ramus-smoke.mjs 2>&1 | tee ramus-smoke.log

      - name: Upload Lane F evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ludomada-lane-f-${{ github.run_id }}
          path: |
            _runs/${{ github.run_id }}/ramus-smoke.log
            _runs/${{ github.run_id }}/ramus-evidence
            _runs/${{ github.run_id }}/android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 7
