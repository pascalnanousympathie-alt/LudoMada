name: Lane F Premium Visual Gate

on:
  workflow_dispatch:
  push:
    branches:
      - feat/google-signin-real
      - feat/ludomada-product-clean-20261013
    paths:
      - "android-app/**"
      - "scripts/audit-material-calibration.mjs"
      - "scripts/check-3d-assets.mjs"
      - "scripts/check-glb-runtime-transform.mjs"
      - "scripts/check-apk-3d-asset.mjs"
      - "scripts/ramus-smoke.mjs"
      - "scripts/check-ramus-wallet-hitbox.mjs"
      - ".github/workflows/lane-f-premium-gate.yml"
  pull_request:
    paths:
      - "android-app/**"
      - "scripts/audit-material-calibration.mjs"
      - "scripts/check-3d-assets.mjs"
      - "scripts/check-glb-runtime-transform.mjs"
      - "scripts/check-apk-3d-asset.mjs"
      - "scripts/ramus-smoke.mjs"
      - "scripts/check-ramus-wallet-hitbox.mjs"
      - ".github/workflows/lane-f-premium-gate.yml"

permissions:
  contents: read
  actions: read

jobs:
  premium-gate:
    # Reuse the exact APK and UI screenshot evidence from the hosted Android emulator
    # run. The gate checks the renderer assets and requires real screen captures.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_MAX_RUNTIME: "39600"
    steps:
      - name: Checkout exact merge candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true
          path: _runs/${{ github.run_id }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Strict premium source gate
        working-directory: ${{ github.workspace }}/_runs/${{ github.run_id }}
        run: |
          set -eu
          node scripts/audit-material-calibration.mjs --strict
          node scripts/check-3d-assets.mjs
          node scripts/check-glb-runtime-transform.mjs
          node scripts/check-ramus-wallet-hitbox.mjs

      - name: Locate successful Cloud Fallback artifact for the exact merge SHA
        id: apk-run
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const branch = pr?.head?.ref || context.ref.replace(/^refs\/heads\//, "");
            const headSha = pr?.head?.sha || context.sha;
            const mergeSha = context.sha;
            const expectedName = `LudoMada-premium-gles3-debug-${mergeSha}`;
            const evidenceName = `LudoMada-hosted-emulator-evidence-${mergeSha}`;
            // Cloud Fallback and Lane F start from the same PR event. Poll for the
            // matching artifact rather than failing simply because Gradle is still building.
            for (let attempt = 1; attempt <= 30; attempt++) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner,
                repo,
                workflow_id: "android-apk-cloud-fallback.yml",
                branch,
                status: "completed",
                per_page: 100
              });
              const candidates = runs.filter(run =>
                run.conclusion === "success" &&
                run.head_sha === headSha
              );
              for (const run of candidates) {
                const listed = await github.rest.actions.listWorkflowRunArtifacts({
                  owner, repo, run_id: run.id, per_page: 100
                });
                const artifact = listed.data.artifacts.find(item =>
                  !item.expired && item.name === expectedName
                );
                const evidence = listed.data.artifacts.find(item =>
                  !item.expired && item.name === evidenceName
                );
                if (artifact && evidence) {
                  core.setOutput("run_id", String(run.id));
                  core.info(`Using APK artifact ${artifact.name} and UI evidence ${evidence.name} from successful run ${run.id}`);
                  return;
                }
              }
              if (attempt < 30) {
                core.info(`Waiting for exact-SHA Cloud Fallback artifact (${attempt}/30)`);
                await new Promise(resolve => setTimeout(resolve, 10000));
              }
            }
            core.setFailed(
              `No successful APK plus hosted emulator evidence artifacts found for head SHA ${headSha} after 5 minutes; inspect the Android Cloud Fallback run.`
            );

      - name: Download verified debug and instrumentation APKs
        uses: actions/download-artifact@v4
        with:
          name: LudoMada-premium-gles3-debug-${{ github.sha }}
          path: ${{ github.workspace }}/_runs/${{ github.run_id }}/android-app/app/build/outputs/apk
          run-id: ${{ steps.apk-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Verify current 3D assets are packaged in the downloaded APK
        working-directory: ${{ github.workspace }}/_runs/${{ github.run_id }}
        run: |
          set -eu
          test -s android-app/app/build/outputs/apk/debug/app-debug.apk
          test -s android-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          node scripts/check-apk-3d-asset.mjs android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Download hosted Android emulator UI evidence
        uses: actions/download-artifact@v4
        with:
          name: LudoMada-hosted-emulator-evidence-${{ github.sha }}
          path: ${{ github.workspace }}/_runs/${{ github.run_id }}/ramus-evidence
          run-id: ${{ steps.apk-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Verify mandatory Home, mode, wallet, market and 2P/3P/4P screenshots
        working-directory: ${{ github.workspace }}/_runs/${{ github.run_id }}
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path
          root = Path('ramus-evidence')
          required_pngs = [
              'hosted-emulator.png',
              'ludomada-home.png',
              'ludomada-game-mode.png',
              'ludomada-wallet.png',
              'ludomada-market.png',
              'ludomada-gameplay-2p.png',
              'ludomada-gameplay-3p.png',
              'ludomada-gameplay-4p.png',
              'ludomada-startup-offline.png',
          ]
          png_magic = bytes.fromhex('89504e470d0a1a0a')
          for name in required_pngs:
              path = root / name
              if not path.is_file():
                  raise SystemExit(f'Missing required UI screenshot: {path}')
              data = path.read_bytes()
              if len(data) < 1000 or not data.startswith(png_magic):
                  raise SystemExit(f'Invalid or truncated PNG screenshot: {path} ({len(data)} bytes)')
          for name in ('adb-devices.txt', 'logcat.txt'):
              path = root / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'Missing Android diagnostics: {path}')
          print('HOSTED_EMULATOR_EVIDENCE_PASS')
          PY

      - name: Upload hosted emulator screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ludomada-lane-f-${{ github.run_id }}
          path: |
            _runs/${{ github.run_id }}/ramus-evidence
            _runs/${{ github.run_id }}/android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 7
