name: Lane F Premium Source Gate (Hosted)

on:
  workflow_dispatch:
  push:
    branches:
      - feat/google-signin-real
      - feat/ludomada-product-clean-20261013
    paths:
      - "android-app/**"
      - "scripts/android-release-audit.py"
      - "scripts/audit-material-calibration.mjs"
      - "scripts/check-3d-assets.mjs"
      - "scripts/check-3d-optimization.mjs"
      - "scripts/check-glb-runtime-transform.mjs"
      - "scripts/check-apk-3d-asset.mjs"
      - "scripts/ramus-smoke.mjs"
      - "scripts/check-ramus-wallet-hitbox.mjs"
      - ".github/workflows/lane-f-premium-gate.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/backend-cloud-validation.yml"
  pull_request:
    paths:
      - "android-app/**"
      - "scripts/android-release-audit.py"
      - "scripts/audit-material-calibration.mjs"
      - "scripts/check-3d-assets.mjs"
      - "scripts/check-3d-optimization.mjs"
      - "scripts/check-glb-runtime-transform.mjs"
      - "scripts/check-apk-3d-asset.mjs"
      - "scripts/ramus-smoke.mjs"
      - "scripts/check-ramus-wallet-hitbox.mjs"
      - ".github/workflows/lane-f-premium-gate.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/backend-cloud-validation.yml"

permissions:
  contents: read

concurrency:
  group: lane-f-premium-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  premium-gate:
    # Source-level premium checks use the existing free self-hosted ARM64 runner.
    # UI/runtime evidence remains independently gated by Android APK Cloud Fallback.
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 15
    env:
      RELEASE_MAX_RUNTIME: "39600"
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use Termux Node.js
        run: |
          set -eu
          mkdir -p "$HOME/.ci-node-bin"
          cat > "$HOME/.ci-node-bin/node" <<'EOF'
          #!/data/data/com.termux/files/usr/bin/sh
          export LD_LIBRARY_PATH=/data/data/com.termux/files/usr/lib
          exec /data/data/com.termux/files/usr/bin/node "$@"
          EOF
          chmod +x "$HOME/.ci-node-bin/node"
          echo "PATH=$HOME/.ci-node-bin:/data/data/com.termux/files/usr/bin:$PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/data/data/com.termux/files/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Strict premium source gate
        run: |
          set -eu
          python3 scripts/android-release-audit.py
          node scripts/audit-material-calibration.mjs --strict
          node scripts/check-3d-assets.mjs
          node scripts/check-3d-optimization.mjs
          node scripts/check-glb-runtime-transform.mjs
          node scripts/check-ramus-wallet-hitbox.mjs
          node --check scripts/ramus-smoke.mjs
