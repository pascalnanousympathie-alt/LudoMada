name: Lane F Premium Visual Gate

on:
  workflow_dispatch:
  push:
    branches:
      - feat/google-signin-real
    paths:
      - "android-app/**"
      - "scripts/audit-material-calibration.mjs"
      - "scripts/check-3d-assets.mjs"
      - "scripts/ramus-smoke.mjs"
      - ".github/workflows/lane-f-premium-gate.yml"
  pull_request:
    paths:
      - "android-app/**"
      - "scripts/audit-material-calibration.mjs"
      - "scripts/check-3d-assets.mjs"
      - "scripts/ramus-smoke.mjs"
      - ".github/workflows/lane-f-premium-gate.yml"

jobs:
  premium-gate:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 45
    concurrency:
      group: ludomada-lane-f-${{ github.head_ref || github.ref }}
      cancel-in-progress: false
    env:
      ANDROID_HOME: /data/data/com.termux/files/home/android-sdk
      ANDROID_SDK_ROOT: /data/data/com.termux/files/home/android-sdk
      JAVA_HOME: /data/data/com.termux/files/usr/lib/jvm/java-21-openjdk
      RELEASE_MAX_RUNTIME: "39600"
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          clean: true
          path: _runs/${{ github.run_id }}

      - name: Use Termux Node
        working-directory: ${{ github.workspace }}/_runs/${{ github.run_id }}
        run: |
          set -eu
          mkdir -p "$HOME/.ci-node-bin"
          cat > "$HOME/.ci-node-bin/node" <<'EOF'
          #!/data/data/com.termux/files/usr/bin/sh
          export LD_LIBRARY_PATH=/data/data/com.termux/files/usr/lib
          exec /data/data/com.termux/files/usr/bin/node "$@"
          EOF
          chmod +x "$HOME/.ci-node-bin/node"
          echo "PATH=$HOME/.ci-node-bin:/data/data/com.termux/files/usr/bin:$PATH" >> "$GITHUB_ENV"

      - name: Strict premium source gate
        working-directory: ${{ github.workspace }}/_runs/${{ github.run_id }}
        run: |
          set -eu
          node scripts/audit-material-calibration.mjs --strict
          node scripts/check-3d-assets.mjs

      - name: Configure Android SDK
        working-directory: ${{ github.workspace }}/_runs/${{ github.run_id }}/android-app
        run: printf "sdk.dir=%s\n" "$ANDROID_HOME" > local.properties

      - name: Configure ARM64 AAPT2
        working-directory: ${{ github.workspace }}/_runs/${{ github.run_id }}
        run: |
          set -eu
          HOME=/data/data/com.termux/files/home bash scripts/setup-termux-aapt2.sh
          printf 'AAPT2_WRAPPER=/data/data/com.termux/files/home/.local/bin/aapt2\n' >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: ${{ github.workspace }}/_runs/${{ github.run_id }}/android-app
        run: |
          set -eu
          chmod +x gradlew
          bash ./gradlew -Pandroid.aapt2FromMavenOverride="$AAPT2_WRAPPER" -PREOWN_PROJECT_ID="${{ secrets.REOWN_PROJECT_ID }}" -Dorg.gradle.workers.max=2 assembleDebug --console=plain --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Install Ramus CLI
        working-directory: ${{ github.workspace }}/_runs/${{ github.run_id }}
        run: |
          set -eu
          rm -rf "$RUNNER_TEMP/ramus-cli"
          mkdir -p "$RUNNER_TEMP/ramus-cli"
          curl -fsSL https://registry.npmjs.org/ramus-cli/-/ramus-cli-0.1.13.tgz -o "$RUNNER_TEMP/ramus-cli/ramus-cli.tgz"
          tar -xzf "$RUNNER_TEMP/ramus-cli/ramus-cli.tgz" -C "$RUNNER_TEMP/ramus-cli"
          test -f "$RUNNER_TEMP/ramus-cli/package/dist/main.js"
          echo "RAMUS_CLI=$RUNNER_TEMP/ramus-cli/package/dist/main.js" >> "$GITHUB_ENV"

      - name: Ramus visual and interaction smoke
        working-directory: ${{ github.workspace }}/_runs/${{ github.run_id }}
        env:
          RAMUS_APK: ${{ github.workspace }}/_runs/${{ github.run_id }}/android-app/app/build/outputs/apk/debug/app-debug.apk
          RAMUS_API_KEY: ${{ secrets.RAMUS_API_KEY }}
          RAMUS_CAPTURE: "1"
        run: |
          set -o pipefail
          timeout -k 10s 900s node scripts/ramus-smoke.mjs 2>&1 | tee ramus-smoke.log

      - name: Upload Lane F evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ludomada-lane-f-${{ github.run_id }}
          path: |
            _runs/${{ github.run_id }}/ramus-smoke.log
            _runs/${{ github.run_id }}/ramus-evidence
            _runs/${{ github.run_id }}/android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 7
