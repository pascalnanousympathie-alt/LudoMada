name: Lane F Premium Visual Gate

on:
  workflow_dispatch:
  push:
    branches:
      - feat/google-signin-real
      - feat/ludomada-product-clean-20261013
    paths:
      - "android-app/**"
      - "scripts/audit-material-calibration.mjs"
      - "scripts/check-3d-assets.mjs"
      - "scripts/check-glb-runtime-transform.mjs"
      - "scripts/check-apk-3d-asset.mjs"
      - "scripts/ramus-smoke.mjs"
      - "scripts/check-ramus-wallet-hitbox.mjs"
      - ".github/workflows/lane-f-premium-gate.yml"
  pull_request:
    paths:
      - "android-app/**"
      - "scripts/audit-material-calibration.mjs"
      - "scripts/check-3d-assets.mjs"
      - "scripts/check-glb-runtime-transform.mjs"
      - "scripts/check-apk-3d-asset.mjs"
      - "scripts/ramus-smoke.mjs"
      - "scripts/check-ramus-wallet-hitbox.mjs"
      - ".github/workflows/lane-f-premium-gate.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: ludomada-lane-f-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  premium-gate:
    # Ramus is a remote emulator. Reuse the exact successful APK from the hosted
    # Cloud Fallback job instead of running a second Gradle build for the same SHA.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact merge candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true
          path: _runs/${{ github.run_id }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Strict premium source gate
        working-directory: ${{ github.workspace }}/_runs/${{ github.run_id }}
        run: |
          set -eu
          node scripts/audit-material-calibration.mjs --strict
          node scripts/check-3d-assets.mjs
          node scripts/check-glb-runtime-transform.mjs
          node scripts/check-ramus-wallet-hitbox.mjs

      - name: Locate successful Cloud Fallback artifact for the exact merge SHA
        id: apk-run
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const branch = pr?.head?.ref || context.ref.replace(/^refs\/heads\//, "");
            const headSha = pr?.head?.sha || context.sha;
            const mergeSha = context.sha;
            const expectedName = `LudoMada-premium-gles3-debug-${mergeSha}`;
            // Cloud Fallback and Lane F start from the same PR event. Poll for the
            // matching artifact rather than failing simply because Gradle is still building.
            for (let attempt = 1; attempt <= 30; attempt++) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner,
                repo,
                workflow_id: "android-apk-cloud-fallback.yml",
                branch,
                status: "completed",
                per_page: 100
              });
              const candidates = runs.filter(run =>
                run.conclusion === "success" &&
                run.head_sha === headSha
              );
              for (const run of candidates) {
                const listed = await github.rest.actions.listWorkflowRunArtifacts({
                  owner, repo, run_id: run.id, per_page: 100
                });
                const artifact = listed.data.artifacts.find(item =>
                  !item.expired && item.name === expectedName
                );
                if (artifact) {
                  core.setOutput("run_id", String(run.id));
                  core.info(`Using APK artifact ${artifact.name} from successful run ${run.id}`);
                  return;
                }
              }
              if (attempt < 30) {
                core.info(`Waiting for exact-SHA Cloud Fallback artifact (${attempt}/30)`);
                await new Promise(resolve => setTimeout(resolve, 10000));
              }
            }
            core.setFailed(
              `No successful Cloud Fallback artifact named "${expectedName}" found for head SHA ${headSha} after 5 minutes; inspect the Android Cloud Fallback run.`
            );

      - name: Download verified debug and instrumentation APKs
        uses: actions/download-artifact@v4
        with:
          name: LudoMada-premium-gles3-debug-${{ github.sha }}
          path: ${{ github.workspace }}/_runs/${{ github.run_id }}/android-app/app/build/outputs/apk
          run-id: ${{ steps.apk-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Verify current 3D assets are packaged in the downloaded APK
        working-directory: ${{ github.workspace }}/_runs/${{ github.run_id }}
        run: |
          set -eu
          test -s android-app/app/build/outputs/apk/debug/app-debug.apk
          test -s android-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          node scripts/check-apk-3d-asset.mjs android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Install pinned Ramus CLI
        working-directory: ${{ github.workspace }}/_runs/${{ github.run_id }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/ramus-cli"
          cp ci/vendor/ramus-cli-0.1.13.tgz "$RUNNER_TEMP/ramus-cli/ramus-cli.tgz"
          printf '%s  %s\n' "ae8e1ae1a0f60c066802cd38a0d49d2a793db9cfc01fb2e9db0f2abaaf8d74f9" "$RUNNER_TEMP/ramus-cli/ramus-cli.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/ramus-cli/ramus-cli.tgz" -C "$RUNNER_TEMP/ramus-cli"
          test -f "$RUNNER_TEMP/ramus-cli/package/dist/main.js"
          echo "RAMUS_CLI=$RUNNER_TEMP/ramus-cli/package/dist/main.js" >> "$GITHUB_ENV"

      - name: Ramus visual and interaction smoke
        working-directory: ${{ github.workspace }}/_runs/${{ github.run_id }}
        env:
          RAMUS_APK: ${{ github.workspace }}/_runs/${{ github.run_id }}/android-app/app/build/outputs/apk/debug/app-debug.apk
          RAMUS_API_KEY: ${{ secrets.RAMUS_API_KEY }}
          RAMUS_CAPTURE: "1"
        run: |
          set -o pipefail
          timeout -k 10s 900s node scripts/ramus-smoke.mjs 2>&1 | tee ramus-smoke.log

      - name: Upload Lane F screenshot and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ludomada-lane-f-${{ github.run_id }}
          path: |
            _runs/${{ github.run_id }}/ramus-smoke.log
            _runs/${{ github.run_id }}/ramus-evidence
            _runs/${{ github.run_id }}/android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 7
