name: Android Hosted Startup Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - ci/hosted-android-startup-diagnostic-20261013
      - ci/hosted-android-startup-diagnostic-v2-20261013
      - ci/hosted-android-startup-diagnostic-v3-20261013
      - ci/hosted-android-startup-diagnostic-v4-20261013
      - ci/hosted-android-startup-diagnostic-v5-20261013
      - ci/hosted-android-startup-diagnostic-v6-20261013
      - ci/ludomada-glsl-pbr-typefix-v7-20261013
      - ci/ludomada-glsl-pbr-smoke-v8-20261013
      - ci/ludomada-live-home-screenshot-v9-20261013
      - ci/ludomada-renderer-init-trace-v10-20261013
      - ci/ludomada-renderer-init-trace-v11-20261013
      - ci/ludomada-renderer-gpu-config-v12-20261013
      - ci/ludomada-renderer-gpu-software-v13-20261013
      - ci/ludomada-live-render-logcat-v14-20261013
      - ci/ludomada-renderer-softgpu-720p-v15-20261013
      - ci/ludomada-single-frame-home-v16-20261013
    paths:
      - "android-app/**"
      - ".github/workflows/android-hosted-instrumentation.yml"

permissions:
  contents: read

concurrency:
  group: ludomada-hosted-instrumentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  startup-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ORG_GRADLE_PROJECT_REOWN_PROJECT_ID: ${{ secrets.REOWN_PROJECT_ID }}
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            android-app/*.gradle.kts
            android-app/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK and emulator image
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 build-tools;36.0.0 emulator system-images;android-35;google_apis;x86_64"

      - name: Configure SDK path and compile test APKs
        run: |
          set -eu
          chmod +x gradlew
          printf "sdk.dir=%s\n" "$ANDROID_HOME" > local.properties
          ./gradlew test assembleDebug assembleDebugAndroidTest --no-daemon --no-parallel -Dorg.gradle.workers.max=2 --console=plain --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Reclaim hosted runner disk for Android userdata
        run: |
          set -eu
          echo "Disk free before cleanup:"
          df -h /home/runner
          # Android 35 needs roughly 7.4 GB free to materialize userdata-qemu.img.
          # Remove unrelated preinstalled toolchains only; keep Java, Android SDK,
          # source checkout, Gradle caches and compiled APKs intact.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/share/powershell /usr/share/swift
          echo "Disk free after cleanup:"
          df -h /home/runner
          available_kib="$(df -Pk /home/runner | awk 'NR == 2 { print $4 }')"
          echo "Available KiB after cleanup: $available_kib"
          if [ "$available_kib" -lt 8500000 ]; then
            echo "Need at least 8.5 GB free for the hosted Android 35 emulator."
            exit 1
          fi

      - name: Enable KVM access on hosted runner
        run: |
          set -eu
          if [ ! -e /dev/kvm ]; then
            echo "KVM device is missing on this runner."
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm

      - name: Run live Home shader smoke and capture emulator evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          # Keep userdata below the hosted-runner free-space ceiling: 5G avoids the
          # emulator's implicit 6G partition request that exceeded available disk.
          disk-size: 5G
          # Normalize the AVD property after the action appends disk-size; avoid a duplicate profile default overriding 5G.
          pre-emulator-launch-script: >-
            set -eu; : "${RUNNER_TEMP:=/home/runner/work/_temp}"; mkdir -p /home/runner/.android; printf '%s\n' 'Vulkan = off' 'GLDirectMem = on' > /home/runner/.android/advancedFeatures.ini; echo "Emulator advanced features:"; cat /home/runner/.android/advancedFeatures.ini; cfg=/home/runner/.android/avd/test.avd/config.ini; mkdir -p "$RUNNER_TEMP/ludomada-device-diag"; echo "AVD disk setting before normalization:"; grep '^disk.dataPartition.size=' "$cfg" || true; sed -i '/^disk\.dataPartition.size=/d' "$cfg"; printf '%s\n' 'disk.dataPartition.size=5G' >> "$cfg"; test "$(grep -c '^disk.dataPartition.size=' "$cfg")" -eq 1; echo "AVD disk setting after normalization:"; grep '^disk.dataPartition.size=' "$cfg"; sed -i '/^hw.lcd.width=/d; /^hw.lcd.height=/d; /^hw.lcd.density=/d' "$cfg"; printf '%s\n' 'hw.lcd.width=1280' 'hw.lcd.height=720' 'hw.lcd.density=240' >> "$cfg"; echo 'AVD render resolution:'; grep -E '^hw.lcd.(width|height|density)=' "$cfg"; printf '%s\n' "AVD_CONFIG=$cfg" > "$RUNNER_TEMP/ludomada-device-diag/avd-config.txt"
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu software -noaudio -no-boot-anim -no-snapshot -wipe-data
          script: >-
            set +e; : "${RUNNER_TEMP:=/home/runner/work/_temp}"; diag="$RUNNER_TEMP/ludomada-device-diag"; mkdir -p "$diag"; timeout 15s adb start-server > "$diag/adb-start.txt" 2>&1; timeout 90s adb wait-for-device > "$diag/adb-wait.txt" 2>&1; wait_exit=$?; timeout 10s adb devices -l > "$diag/devices-before.txt" 2>&1; if [ "$wait_exit" -ne 0 ]; then echo "ADB_DEVICE_WAIT_FAILED exit=$wait_exit"; cat "$diag/adb-wait.txt" "$diag/devices-before.txt"; exit 31; fi; timeout 10s adb shell getprop sys.boot_completed > "$diag/boot-completed.txt" 2>&1; timeout 10s adb install -r android-app/app/build/outputs/apk/debug/app-debug.apk > "$diag/install-debug-apk.txt" 2>&1; install_exit=$?; if [ "$install_exit" -ne 0 ]; then echo "ADB_INSTALL_FAILED exit=$install_exit"; cat "$diag/install-debug-apk.txt"; exit 32; fi; timeout 10s adb shell run-as com.ludomadagascar mkdir -p shared_prefs > "$diag/single-frame-pref-mkdir.txt" 2>&1; mkdir_exit=$?; echo "SINGLE_FRAME_PREF_MKDIR_EXIT=$mkdir_exit"; printf '%s' 'PG1hcD48Ym9vbGVhbiBuYW1lPSJzaW5nbGVfaG9tZV9mcmFtZSIgdmFsdWU9InRydWUiIC8+PC9tYXA+' | base64 -d | timeout 10s adb shell run-as com.ludomadagascar tee shared_prefs/ludomada_debug.xml > "$diag/single-frame-pref-write.txt" 2>&1; pref_exit=$?; echo "SINGLE_FRAME_PREF_EXIT=$pref_exit"; timeout 10s adb shell run-as com.ludomadagascar ls -la shared_prefs > "$diag/single-frame-pref-list.txt" 2>&1 || true; timeout 10s adb shell run-as com.ludomadagascar cat shared_prefs/ludomada_debug.xml > "$diag/single-frame-pref-readback.txt" 2>&1 || true; timeout 10s adb logcat -c > "$diag/logcat-clear.txt" 2>&1; timeout 140s adb logcat -b all -v threadtime > "$diag/live-render-logcat.txt" 2>&1 & logcat_pid=$!; echo "LIVE_LOGCAT_PID=$logcat_pid"; timeout 10s adb shell am force-stop com.ludomadagascar > "$diag/force-stop.txt" 2>&1 || true; timeout 90s adb shell am start -W -n com.ludomadagascar/.MainActivity > "$diag/main-activity-launch.txt" 2>&1; launch_exit=$?; echo "LAUNCH_EXIT=$launch_exit"; echo "Waiting 35 seconds for the in-app PixelCopy capture"; sleep 35; timeout 20s adb shell run-as com.ludomadagascar cat cache/live-premium-home-pixelcopy.png > "$diag/live-premium-home.png" 2> "$diag/screenshot.err"; screenshot_exit=$?; echo "PIXELCOPY_PULL_EXIT=$screenshot_exit"; echo "SCREENSHOT_EXIT=$screenshot_exit"; kill "$logcat_pid" >/dev/null 2>&1 || true; wait "$logcat_pid" >/dev/null 2>&1 || true; if [ ! -s "$diag/live-render-logcat.txt" ]; then timeout 15s adb logcat -d -v threadtime > "$diag/logcat-fallback.txt" 2>&1 || true; fi; timeout 15s adb shell dumpsys activity activities > "$diag/activities.txt" 2>&1 || true; timeout 15s adb shell dumpsys window windows > "$diag/windows.txt" 2>&1 || true; ps -ef | grep -E '[e]mulator|[q]emu-system' > "$diag/host-emulator-processes.txt" 2>&1 || true; find /home/runner/.android -maxdepth 5 -type f \( -iname '*crash*' -o -iname '*.log' -o -iname '*.txt' \) -printf '%TY-%Tm-%Td %TH:%TM:%TS %s %p\n' > "$diag/host-android-logs-index.txt" 2>&1 || true; for f in /home/runner/.android/emu-crash-* /home/runner/.android/avd/test.avd/*.log /home/runner/.android/avd/test.avd/*.txt; do [ -f "$f" ] && cp "$f" "$diag/$(basename "$f")" || true; done; echo "--- Renderer milestones captured live ---"; grep -E 'LudoMadaStartup:|LudoMadaRender:|GL shader: ERROR|FATAL EXCEPTION|Fatal signal|SIGSEGV|OutOfMemoryError|PBR_INIT_' "$diag/live-render-logcat.txt" | tail -180 || true; if [ "$screenshot_exit" -ne 0 ] || [ ! -s "$diag/live-premium-home.png" ] || [ "$(wc -c < "$diag/live-premium-home.png")" -lt 1000 ]; then echo "LIVE_HOME_SCREENSHOT_FAILED exit=$screenshot_exit"; cat "$diag/screenshot.err"; exit 21; fi; if ! grep -q 'HOME_CONTENT_VIEW_ATTACHED' "$diag/live-render-logcat.txt"; then echo "HOME_ACTIVITY_MARKER_MISSING"; exit 22; fi; if ! grep -q 'Renderer=GLES3_PBR' "$diag/live-render-logcat.txt"; then echo "GLES3_PBR_RENDERER_MARKER_MISSING"; exit 23; fi; if grep -q 'GL shader: ERROR' "$diag/live-render-logcat.txt"; then echo "GLSL_SHADER_COMPILE_ERROR"; exit 25; fi; if ! grep -q 'PBR_FIRST_DRAW' "$diag/live-render-logcat.txt"; then echo "PBR_FIRST_FRAME_NOT_REACHED"; exit 26; fi; if ! grep -q 'DIAGNOSTIC_PIXELCOPY_SAVED' "$diag/live-render-logcat.txt"; then echo "PIXELCOPY_WINDOW_CAPTURE_NOT_CONFIRMED"; exit 29; fi; if ! grep -q 'ENV_GLB_RUNTIME_LOAD_OK' "$diag/live-render-logcat.txt"; then echo "ENVIRONMENT_GLB_LOAD_NOT_CONFIRMED"; exit 27; fi; if ! grep -q 'BAOBAB_REAL_GLB_LOAD_OK' "$diag/live-render-logcat.txt"; then echo "REAL_BAOBAB_GLB_LOAD_NOT_CONFIRMED"; exit 28; fi; echo "LIVE_HOME_RENDERER_TRACE_PASS: live Logcat, screenshot, PBR first frame, environment GLB, and baobab evidence captured."

      - name: Upload instrumentation reports and Android device diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LudoMada-startup-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ludomada-connected-tests.log
            ${{ runner.temp }}/ludomada-device-diag/**
            android-app/app/build/reports/androidTests/connected/debug/**
            android-app/app/build/outputs/androidTest-results/connected/debug/**
            android-app/app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 7
