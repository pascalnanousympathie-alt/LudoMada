name: Android Hosted Startup Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - ci/hosted-android-startup-diagnostic-20261013
      - ci/hosted-android-startup-diagnostic-v2-20261013
      - ci/hosted-android-startup-diagnostic-v3-20261013
      - ci/hosted-android-startup-diagnostic-v4-20261013
      - ci/hosted-android-startup-diagnostic-v5-20261013
      - ci/hosted-android-startup-diagnostic-v6-20261013
      - ci/ludomada-glsl-pbr-typefix-v7-20261013
      - ci/ludomada-glsl-pbr-smoke-v8-20261013
      - ci/ludomada-live-home-screenshot-v9-20261013
      - ci/ludomada-renderer-init-trace-v10-20261013
    paths:
      - "android-app/**"
      - ".github/workflows/android-hosted-instrumentation.yml"

permissions:
  contents: read

concurrency:
  group: ludomada-hosted-instrumentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  startup-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ORG_GRADLE_PROJECT_REOWN_PROJECT_ID: ${{ secrets.REOWN_PROJECT_ID }}
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            android-app/*.gradle.kts
            android-app/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK and emulator image
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 build-tools;36.0.0 emulator system-images;android-35;google_apis;x86_64"

      - name: Configure SDK path and compile test APKs
        run: |
          set -eu
          chmod +x gradlew
          printf "sdk.dir=%s\n" "$ANDROID_HOME" > local.properties
          ./gradlew test assembleDebug assembleDebugAndroidTest --no-daemon --no-parallel -Dorg.gradle.workers.max=2 --console=plain --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Reclaim hosted runner disk for Android userdata
        run: |
          set -eu
          echo "Disk free before cleanup:"
          df -h /home/runner
          # Android 35 needs roughly 7.4 GB free to materialize userdata-qemu.img.
          # Remove unrelated preinstalled toolchains only; keep Java, Android SDK,
          # source checkout, Gradle caches and compiled APKs intact.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/share/powershell /usr/share/swift
          echo "Disk free after cleanup:"
          df -h /home/runner
          available_kib="$(df -Pk /home/runner | awk 'NR == 2 { print $4 }')"
          echo "Available KiB after cleanup: $available_kib"
          if [ "$available_kib" -lt 8500000 ]; then
            echo "Need at least 8.5 GB free for the hosted Android 35 emulator."
            exit 1
          fi

      - name: Enable KVM access on hosted runner
        run: |
          set -eu
          if [ ! -e /dev/kvm ]; then
            echo "KVM device is missing on this runner."
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm

      - name: Run live Home shader smoke and capture emulator evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          # Keep userdata below the hosted-runner free-space ceiling: 5G avoids the
          # emulator's implicit 6G partition request that exceeded available disk.
          disk-size: 5G
          # Normalize the AVD property after the action appends disk-size; avoid a duplicate profile default overriding 5G.
          pre-emulator-launch-script: >-
            set -eu; : "${RUNNER_TEMP:=/home/runner/work/_temp}"; cfg=/home/runner/.android/avd/test.avd/config.ini; mkdir -p "$RUNNER_TEMP/ludomada-device-diag"; echo "AVD disk setting before normalization:"; grep '^disk.dataPartition.size=' "$cfg" || true; sed -i '/^disk\.dataPartition.size=/d' "$cfg"; printf '%s\n' 'disk.dataPartition.size=5G' >> "$cfg"; test "$(grep -c '^disk.dataPartition.size=' "$cfg")" -eq 1; echo "AVD disk setting after normalization:"; grep '^disk.dataPartition.size=' "$cfg"; printf '%s\n' "AVD_CONFIG=$cfg" > "$RUNNER_TEMP/ludomada-device-diag/avd-config.txt"
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data
          script: >-
            set +e; : "${RUNNER_TEMP:=/home/runner/work/_temp}"; diag="$RUNNER_TEMP/ludomada-device-diag"; mkdir -p "$diag"; adb devices -l > "$diag/devices-before.txt" 2>&1; adb logcat -c >/dev/null 2>&1; adb install -r android-app/app/build/outputs/apk/debug/app-debug.apk > "$diag/install-debug-apk.txt" 2>&1; install_exit=$?; if [ "$install_exit" -ne 0 ]; then cat "$diag/install-debug-apk.txt"; exit "$install_exit"; fi; adb shell am force-stop com.ludomadagascar >/dev/null 2>&1 || true; adb shell am start -W -n com.ludomadagascar/.MainActivity > "$diag/main-activity-launch.txt" 2>&1 || true; echo "Waiting up to 55 seconds for PBR initialization / first Home frame"; sleep 55; adb exec-out screencap -p > "$diag/live-premium-home.png" 2> "$diag/screenshot.err"; screenshot_exit=$?; adb logcat -d -v threadtime > "$diag/home-render-logcat.txt" 2>&1 || true; adb shell dumpsys activity activities > "$diag/activities.txt" 2>&1 || true; adb shell dumpsys window windows > "$diag/windows.txt" 2>&1 || true; cat "$diag/main-activity-launch.txt"; echo "--- Renderer milestone evidence ---"; grep -E 'LudoMadaStartup:|LudoMadaRender:|GL shader: ERROR|FATAL EXCEPTION' "$diag/home-render-logcat.txt" | tail -100 || true; if [ "$screenshot_exit" -ne 0 ] || [ ! -s "$diag/live-premium-home.png" ] || [ "$(wc -c < "$diag/live-premium-home.png")" -lt 1000 ]; then echo "LIVE_HOME_SCREENSHOT_FAILED"; cat "$diag/screenshot.err"; exit 21; fi; if ! grep -q 'HOME_CONTENT_VIEW_ATTACHED' "$diag/home-render-logcat.txt"; then echo "HOME_ACTIVITY_MARKER_MISSING"; exit 22; fi; if ! grep -q 'Renderer=GLES3_PBR' "$diag/home-render-logcat.txt"; then echo "GLES3_PBR_RENDERER_MARKER_MISSING"; exit 23; fi; if grep -q 'GL shader: ERROR' "$diag/home-render-logcat.txt"; then echo "GLSL_SHADER_COMPILE_ERROR"; exit 25; fi; if ! grep -q 'PBR_FIRST_DRAW' "$diag/home-render-logcat.txt"; then echo "PBR_FIRST_FRAME_NOT_REACHED"; exit 26; fi; if ! grep -q 'ENV_GLB_RUNTIME_LOAD_OK' "$diag/home-render-logcat.txt"; then echo "ENVIRONMENT_GLB_LOAD_NOT_CONFIRMED"; exit 27; fi; if ! grep -q 'BAOBAB_REAL_GLB_LOAD_OK' "$diag/home-render-logcat.txt"; then echo "REAL_BAOBAB_GLB_LOAD_NOT_CONFIRMED"; exit 28; fi; echo "LIVE_HOME_RENDERER_TRACE_PASS: Activity, screenshot, GLES3 PBR, first rendered frame, GLB environment and real baobab evidence captured."

      - name: Upload instrumentation reports and Android device diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LudoMada-startup-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ludomada-connected-tests.log
            ${{ runner.temp }}/ludomada-device-diag/**
            android-app/app/build/reports/androidTests/connected/debug/**
            android-app/app/build/outputs/androidTest-results/connected/debug/**
            android-app/app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 7
