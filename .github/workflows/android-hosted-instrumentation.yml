name: Android Hosted Startup Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - ci/hosted-android-startup-diagnostic-20261013
      - ci/hosted-android-startup-diagnostic-v2-20261013
      - ci/hosted-android-startup-diagnostic-v3-20261013
      - ci/hosted-android-startup-diagnostic-v4-20261013
      - ci/hosted-android-startup-diagnostic-v5-20261013
      - ci/hosted-android-startup-diagnostic-v6-20261013
      - ci/ludomada-glsl-pbr-typefix-v7-20261013
      - ci/ludomada-glsl-pbr-smoke-v8-20261013
    paths:
      - "android-app/**"
      - ".github/workflows/android-hosted-instrumentation.yml"

permissions:
  contents: read

concurrency:
  group: ludomada-hosted-instrumentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  startup-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ORG_GRADLE_PROJECT_REOWN_PROJECT_ID: ${{ secrets.REOWN_PROJECT_ID }}
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            android-app/*.gradle.kts
            android-app/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK and emulator image
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 build-tools;36.0.0 emulator system-images;android-35;google_apis;x86_64"

      - name: Configure SDK path and compile test APKs
        run: |
          set -eu
          chmod +x gradlew
          printf "sdk.dir=%s\n" "$ANDROID_HOME" > local.properties
          ./gradlew test assembleDebug assembleDebugAndroidTest --no-daemon --no-parallel -Dorg.gradle.workers.max=2 --console=plain --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Reclaim hosted runner disk for Android userdata
        run: |
          set -eu
          echo "Disk free before cleanup:"
          df -h /home/runner
          # Android 35 needs roughly 7.4 GB free to materialize userdata-qemu.img.
          # Remove unrelated preinstalled toolchains only; keep Java, Android SDK,
          # source checkout, Gradle caches and compiled APKs intact.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/share/powershell /usr/share/swift
          echo "Disk free after cleanup:"
          df -h /home/runner
          available_kib="$(df -Pk /home/runner | awk 'NR == 2 { print $4 }')"
          echo "Available KiB after cleanup: $available_kib"
          if [ "$available_kib" -lt 8500000 ]; then
            echo "Need at least 8.5 GB free for the hosted Android 35 emulator."
            exit 1
          fi

      - name: Enable KVM access on hosted runner
        run: |
          set -eu
          if [ ! -e /dev/kvm ]; then
            echo "KVM device is missing on this runner."
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm

      - name: Run StartupUiTest on a hosted Android emulator and preserve device diagnostics
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          # Keep userdata below the hosted-runner free-space ceiling: 5G avoids the
          # emulator's implicit 6G partition request that exceeded available disk.
          disk-size: 5G
          # Normalize the AVD property after the action appends disk-size; avoid a duplicate profile default overriding 5G.
          pre-emulator-launch-script: >-
            set -eu; : "${RUNNER_TEMP:=/home/runner/work/_temp}"; cfg=/home/runner/.android/avd/test.avd/config.ini; mkdir -p "$RUNNER_TEMP/ludomada-device-diag"; echo "AVD disk setting before normalization:"; grep '^disk.dataPartition.size=' "$cfg" || true; sed -i '/^disk\.dataPartition.size=/d' "$cfg"; printf '%s\n' 'disk.dataPartition.size=5G' >> "$cfg"; test "$(grep -c '^disk.dataPartition.size=' "$cfg")" -eq 1; echo "AVD disk setting after normalization:"; grep '^disk.dataPartition.size=' "$cfg"; printf '%s\n' "AVD_CONFIG=$cfg" > "$RUNNER_TEMP/ludomada-device-diag/avd-config.txt"; (for attempt in $(seq 1 600); do if adb -s emulator-5554 get-state 2>/dev/null | grep -qx device; then adb -s emulator-5554 logcat -b all -v threadtime > "$RUNNER_TEMP/ludomada-device-diag/pretest-logcat.txt" 2>&1; exit 0; fi; sleep 2; done) </dev/null >/dev/null 2>&1 &
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data
          script: >-
            set +e; : "${RUNNER_TEMP:=/home/runner/work/_temp}"; mkdir -p "$RUNNER_TEMP/ludomada-device-diag"; cd android-app || exit 90; echo "SMOKE_TEST_BEGIN_UTC=$(date -u +%FT%TZ)"; timeout --signal=TERM --kill-after=15s 180s ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.ludomadagascar.StartupUiTest#premium_home_shader_smoke --no-daemon --no-parallel -Dorg.gradle.workers.max=2 --console=plain --stacktrace > "$RUNNER_TEMP/ludomada-connected-tests.log" 2>&1; test_exit=$?; echo "SMOKE_TEST_EXIT=$test_exit UTC=$(date -u +%FT%TZ)" >> "$RUNNER_TEMP/ludomada-connected-tests.log"; cat "$RUNNER_TEMP/ludomada-connected-tests.log"; adb shell am force-stop com.ludomadagascar || true; adb shell am start -W -n com.ludomadagascar/.MainActivity > "$RUNNER_TEMP/ludomada-device-diag/manual-launch-after-tests.txt" 2>&1 || true; sleep 5; adb exec-out screencap -p > "$RUNNER_TEMP/ludomada-device-diag/home-after-tests.png" 2> "$RUNNER_TEMP/ludomada-device-diag/screenshot-after.err" || true; adb logcat -d -v threadtime > "$RUNNER_TEMP/ludomada-device-diag/logcat-final.txt" 2>&1 || true; adb shell dumpsys activity activities > "$RUNNER_TEMP/ludomada-device-diag/activities.txt" 2>&1 || true; adb shell dumpsys activity top > "$RUNNER_TEMP/ludomada-device-diag/activity-top.txt" 2>&1 || true; adb shell dumpsys package com.ludomadagascar > "$RUNNER_TEMP/ludomada-device-diag/package.txt" 2>&1 || true; adb shell dumpsys window windows > "$RUNNER_TEMP/ludomada-device-diag/windows.txt" 2>&1 || true; exit "$test_exit"

      - name: Upload instrumentation reports and Android device diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LudoMada-startup-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ludomada-connected-tests.log
            ${{ runner.temp }}/ludomada-device-diag/**
            android-app/app/build/reports/androidTests/connected/debug/**
            android-app/app/build/outputs/androidTest-results/connected/debug/**
            android-app/app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 7
