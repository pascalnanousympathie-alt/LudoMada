name: Android UI Instrumentation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android-app/**"
      - ".github/scripts/run-android-ui-instrumentation.sh"
      - ".github/workflows/android-ui-instrumentation.yml"
  pull_request:
    paths:
      - "android-app/**"
      - ".github/scripts/run-android-ui-instrumentation.sh"
      - ".github/workflows/android-ui-instrumentation.yml"

permissions:
  contents: read

concurrency:
  group: android-ui-instrumentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-instrumentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK and emulator images
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-27 platforms;android-30 platforms;android-35 build-tools;35.0.0 emulator system-images;android-27;google_apis;x86 system-images;android-30;google_apis;x86_64"

      - name: Configure Android SDK
        working-directory: android-app
        run: printf "sdk.dir=%s\\n" "$ANDROID_HOME" > local.properties

      - name: Run Kotlin/JVM tests and build instrumentation APKs
        working-directory: android-app
        run: |
          set -eu
          chmod +x gradlew
          ./gradlew test assembleDebug assembleDebugAndroidTest --no-daemon --no-parallel -Dorg.gradle.workers.max=2 --console=plain --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Enable KVM hardware acceleration for the emulator
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -e /dev/kvm ]]; then
            echo "KVM_REQUIRED: /dev/kvm is not present on this runner"
            exit 1
          fi
          # Hosted Ubuntu exposes /dev/kvm as root:kvm but the runner user may
          # not be a member of that group. The emulator otherwise silently falls
          # back to slow software emulation and stays adb-offline on this image.
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm
          if ! grep -qm1 -E '(vmx|svm)' /proc/cpuinfo; then
            echo "KVM_CPU_VIRTUALIZATION_FLAG_MISSING"
            exit 1
          fi

      - name: Run connected Android UI instrumentation tests (API 30)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 900
          disk-size: 4096M
          ram-size: 3072M
          heap-size: 1024M
          sdcard-path-or-size: 256M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -no-snapshot-save
          script: bash .github/scripts/run-android-ui-instrumentation.sh

      - name: Preserve API 30 screenshot evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          source_file="android-app/app/build/ramus-evidence/ludomada-startup-offline.png"
          if [[ -s "$source_file" ]]; then
            mkdir -p android-app/app/build/ramus-evidence/api30
            cp -- "$source_file" android-app/app/build/ramus-evidence/api30/ludomada-startup-offline.png
          fi

      - name: Run connected Android UI instrumentation tests (Android 8.1 / API 27)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 27
          target: google_apis
          arch: x86
          profile: pixel_2
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 900
          disk-size: 4096M
          ram-size: 3072M
          heap-size: 1024M
          sdcard-path-or-size: 256M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -no-snapshot-save
          script: bash .github/scripts/run-android-ui-instrumentation.sh

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-ui-instrumentation-${{ github.sha }}
          path: |
            android-app/app/build/reports/androidTests/connected/
            android-app/app/build/outputs/androidTest-results/connected/
            android-app/app/build/ramus-evidence/
          if-no-files-found: warn
          retention-days: 14
