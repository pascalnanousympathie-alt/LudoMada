name: Ludo Mada V6.3 CI

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "jest.config.cjs"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "jest.config.cjs"
      - ".github/workflows/ci.yml"

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, linux, ARM64]
    env:
      DATABASE_URL: postgresql://u0_a214@localhost:5432/ludomada_ci
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - name: Use runner Linux Node
        run: echo "/data/data/com.termux/files/home/actions-runner/externals/node24/bin" >> "$GITHUB_PATH"
      - run: node -v && npm -v
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test -- --maxWorkers=2
