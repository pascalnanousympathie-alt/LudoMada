name: Ludo Mada V6.3 CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "jest.config.cjs"
      - ".github/workflows/ci.yml"

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 20
    env:
      DB_SCHEMA: ci_${{ github.run_id }}
      DATABASE_URL: postgresql://u0_a214@127.0.0.1:5432/ludomada_ci?schema=ci_${{ github.run_id }}
      NODE_ENV: test
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      JAVA_HOME: /data/data/com.termux/files/usr/lib/jvm/java-21-openjdk
      NODE_OPTIONS: --max-old-space-size=512
      npm_config_maxsockets: "1"
      npm_config_jobs: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - name: Use runner Linux Node
        run: echo "/data/data/com.termux/files/home/actions-runner/externals/node24/bin" >> "$GITHUB_PATH"
      - run: node -v && npm -v
      - name: Verify local PostgreSQL
        run: |
          set -eu
          command -v psql
          pg_isready -h 127.0.0.1 -p 5432 -U u0_a214
      - run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund --omit=optional
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test -- --maxWorkers=2
