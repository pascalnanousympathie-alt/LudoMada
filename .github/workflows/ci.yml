name: Ludo Mada V6.3 CI

on:
  workflow_dispatch:
  # Keep a push trigger only for workflow-maintenance commits. The job itself
  # stays skipped on push so the single ARM64 runner is reserved for Android.
  push:
    paths:
      - ".github/workflows/ci.yml"

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 20
    env:
      NODE_ENV: test
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      NODE_OPTIONS: --max-old-space-size=512
      npm_config_maxsockets: "1"
      npm_config_jobs: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - name: Use runner Linux Node
        run: echo "/data/data/com.termux/files/home/actions-runner/externals/node24/bin" >> "$GITHUB_PATH"
      - run: node -v && npm -v
      - name: Install dependencies
        run: timeout -k 10s 600s npm install --ignore-scripts --prefer-offline --no-audit --no-fund --omit=optional
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Run backend tests
        run: npm test -- --maxWorkers=2
      - name: Build backend
        run: npm run build
