name: Ludo Mada V6.3 CI (Hosted PostgreSQL)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "jest.config.cjs"
      - ".github/workflows/ci.yml"
      - ".github/workflows/backend-cloud-validation.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Hosted PostgreSQL integration, concurrency and typecheck
    uses: ./.github/workflows/backend-cloud-validation.yml
