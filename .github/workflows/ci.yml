name: Ludo Mada V6.3 CI (hosted)

# Automated pull-request validation is owned by backend-cloud-validation.yml.
# This manual entry point reuses the same hosted PostgreSQL/Node job and never
# depends on a Termux self-hosted runner.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-validation:
    uses: ./.github/workflows/backend-cloud-validation.yml
    secrets: inherit
