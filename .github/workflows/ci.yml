name: Ludo Mada V6.3 CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "jest.config.cjs"
      - ".github/workflows/ci.yml"

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 20
    env:
      NODE_ENV: test
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      NODE_OPTIONS: --max-old-space-size=512
      npm_config_maxsockets: "1"
      npm_config_jobs: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source from GitHub
        working-directory: .
        env:
          GIT_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [ -d "$GITHUB_WORKSPACE/.git" ]; then
            git -C "$GITHUB_WORKSPACE" remote remove origin 2>/dev/null || true
          else
            rm -rf "$GITHUB_WORKSPACE"
            mkdir -p "$GITHUB_WORKSPACE"
            git -C "$GITHUB_WORKSPACE" init
          fi
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/$GITHUB_REPOSITORY.git" 2>/dev/null || true
          git -C "$GITHUB_WORKSPACE" remote set-url origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -c credential.helper= -C "$GITHUB_WORKSPACE" fetch --depth=1 "https://x-access-token:$GIT_AUTH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach "$GITHUB_SHA"

      - name: Use Termux Node
        run: |
          set -eu
          mkdir -p "$HOME/.ci-node-bin"
          cat > "$HOME/.ci-node-bin/node" <<'EOF'
          #!/bin/sh
          export LD_LIBRARY_PATH=/data/data/com.termux/files/usr/lib
          exec /data/data/com.termux/files/usr/bin/node "$@"
          EOF
          cat > "$HOME/.ci-node-bin/npm" <<'EOF'
          #!/bin/sh
          export LD_LIBRARY_PATH=/data/data/com.termux/files/usr/lib
          exec /data/data/com.termux/files/usr/bin/node /data/data/com.termux/files/usr/bin/npm "$@"
          EOF
          cat > "$HOME/.ci-node-bin/npx" <<'EOF'
          #!/bin/sh
          export LD_LIBRARY_PATH=/data/data/com.termux/files/usr/lib
          exec /data/data/com.termux/files/usr/bin/node /data/data/com.termux/files/usr/bin/npx "$@"
          EOF
          chmod +x "$HOME/.ci-node-bin/node" "$HOME/.ci-node-bin/npm" "$HOME/.ci-node-bin/npx"
          echo "PATH=$HOME/.ci-node-bin:/data/data/com.termux/files/usr/bin:$PATH" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: node -v && npm -v
      - name: Show runner memory
        run: |
          free -h
          awk '/MemTotal|MemAvailable|SwapTotal|SwapFree/ {print}' /proc/meminfo
          df -h "$GITHUB_WORKSPACE"
      - name: Prepare persistent dependencies
        run: |
          set -eu
          source_dir="/data/data/com.termux/files/home/LudoMada/node_modules"
          test -d "$source_dir"
          expected_lock="$(sha256sum package-lock.json | awk '{print $1}')"
          source_lock="$(sha256sum "/data/data/com.termux/files/home/LudoMada/package-lock.json" | awk '{print $1}')"
          test "$expected_lock" = "$source_lock"
          test -f "$source_dir/.package-lock.json"
          if [ -L node_modules ] || [ -d node_modules ]; then
            rm -rf node_modules
          fi
          ln -s "$source_dir" node_modules
          node -e "require('@prisma/client'); require('jest'); require('typescript'); require('fs').accessSync('node_modules/prisma/build/index.js'); console.log('DEPS_CORE_OK')"
      - name: Generate Prisma client
        run: node node_modules/prisma/build/index.js generate
      - name: Run backend tests
        run: npm test -- --maxWorkers=2
      - name: Build backend
        run: npm run build
