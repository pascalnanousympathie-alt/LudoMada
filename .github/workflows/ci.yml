name: Ludo Mada V6.3 CI (hosted)

# Pull requests run backend-cloud-validation.yml automatically. This manual
# entry point reuses the same hosted PostgreSQL/Node job and has no Termux runner.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-validation:
    uses: ./.github/workflows/backend-cloud-validation.yml
    secrets: inherit
