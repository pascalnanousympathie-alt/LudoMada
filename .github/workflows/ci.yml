name: Ludo Mada V6.3 CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "jest.config.cjs"
      - ".github/workflows/ci.yml"

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ludomada_ci
          POSTGRES_PASSWORD: ludomada_ci
          POSTGRES_DB: ludomada_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ludomada_ci -d ludomada_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://ludomada_ci:ludomada_ci@localhost:5432/ludomada_ci?schema=public
      NODE_ENV: test
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - run: node -v && npm -v
      - run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test -- --maxWorkers=2
