name: Ludo Mada V6.3 CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "jest.config.cjs"
      - ".github/workflows/ci.yml"

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 20
    env:
      NODE_ENV: test
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      NODE_OPTIONS: --max-old-space-size=512
      npm_config_maxsockets: "1"
      npm_config_jobs: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source without external action
        working-directory: .
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          if [ ! -d .git ]; then
            git init
            git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          elif ! git remote get-url origin >/dev/null 2>&1; then
            git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          fi
          git fetch --depth=1 origin "$GITHUB_SHA"
          git reset --hard "$GITHUB_SHA"
      - name: Use runner Linux Node
        run: echo "/data/data/com.termux/files/home/actions-runner/externals/node24/bin" >> "$GITHUB_PATH"
      - name: Show toolchain
        run: node -v && npm -v
      - name: Show runner memory
        run: |
          free -h
          awk '/MemTotal|MemAvailable|SwapTotal|SwapFree/ {print}' /proc/meminfo
          df -h "$GITHUB_WORKSPACE"
      - name: Prepare persistent dependencies
        run: |
          set -eu
          source_dir="$HOME/LudoMada/node_modules"
          test -d "$source_dir"
          expected_lock="$(sha256sum package-lock.json | awk '{print $1}')"
          source_lock="$(sha256sum "$HOME/LudoMada/package-lock.json" | awk '{print $1}')"
          test "$expected_lock" = "$source_lock"
          test -f "$source_dir/.package-lock.json"
          if [ -L node_modules ] || [ -d node_modules ]; then
            rm -rf node_modules
          fi
          ln -s "$source_dir" node_modules
          node -e "require('@prisma/client'); require('jest'); require('typescript'); require('fs').accessSync('node_modules/prisma/build/index.js'); console.log('DEPS_CORE_OK')"
      - name: Generate Prisma client
        run: node node_modules/prisma/build/index.js generate
      - name: Run backend tests
        run: npm test -- --maxWorkers=2
      - name: Build backend
        run: npm run build
