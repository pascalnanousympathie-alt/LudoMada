name: Build Ludo Madagascar APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 30
    concurrency:
      group: android-apk-${{ github.ref }}
      cancel-in-progress: true
    env:
      ANDROID_HOME: /data/data/com.termux/files/home/android-sdk
      ANDROID_SDK_ROOT: /data/data/com.termux/files/home/android-sdk
      JAVA_HOME: /data/data/com.termux/files/usr/lib/jvm/java-21-openjdk
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - name: Accept Android SDK licenses
        working-directory: .
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          cat > "$ANDROID_HOME/licenses/android-sdk-license" <<'EOF'
          8933bad161af4178b1185d1a37fbf41ea5269c55
          d56f5187479451eabf01fb78af6dfcb131a6481e
          24333f8a63b6825ea9c5514f83c2829b004d1fee
          EOF

      - name: Configure Android SDK path
        run: printf "sdk.dir=%s\n" "$ANDROID_HOME" > local.properties
      - name: Configure ARM64 AAPT2
        working-directory: .
        run: |
          HOME=/data/data/com.termux/files/home bash scripts/setup-termux-aapt2.sh
          printf 'AAPT2_WRAPPER=/data/data/com.termux/files/home/.local/bin/aapt2\n' >> "$GITHUB_ENV"
      - run: chmod +x gradlew
      - run: bash ./gradlew --version
      - run: bash ./gradlew -Pandroid.aapt2FromMavenOverride="$AAPT2_WRAPPER" -PREOWN_PROJECT_ID="${{ secrets.REOWN_PROJECT_ID }}" -Dorg.gradle.workers.max=2 assembleDebug --stacktrace
      - run: |
          set -eu
          test -s app/build/outputs/apk/debug/app-debug.apk
          target="/sdcard/Download/LudoMada-premium-gles3-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$target"
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee /sdcard/Download/LudoMada-premium-gles3-debug.sha256

