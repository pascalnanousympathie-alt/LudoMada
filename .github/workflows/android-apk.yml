name: Build Ludo Madagascar APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 30
    concurrency:
      group: android-apk-${{ github.ref }}
      cancel-in-progress: true
    env:
      ANDROID_HOME: /data/data/com.termux/files/home/android-sdk
      ANDROID_SDK_ROOT: /data/data/com.termux/files/home/android-sdk
      JAVA_HOME: /data/data/com.termux/files/usr/lib/jvm/java-21-openjdk
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout source from GitHub
        working-directory: .
        env:
          GIT_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [ -d "$GITHUB_WORKSPACE/.git" ]; then
            git -C "$GITHUB_WORKSPACE" remote remove origin 2>/dev/null || true
          else
            rm -rf "$GITHUB_WORKSPACE"
            mkdir -p "$GITHUB_WORKSPACE"
            git -C "$GITHUB_WORKSPACE" init
          fi
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/$GITHUB_REPOSITORY.git" 2>/dev/null || true
          git -C "$GITHUB_WORKSPACE" remote set-url origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -c credential.helper= -C "$GITHUB_WORKSPACE" fetch --depth=1 "https://x-access-token:$GIT_AUTH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach "$GITHUB_SHA"

      - name: Accept Android SDK licenses
        working-directory: .
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          cat > "$ANDROID_HOME/licenses/android-sdk-license" <<'EOF'
          8933bad161af4178b1185d1a37fbf41ea5269c55
          d56f5187479451eabf01fb78af6dfcb131a6481e
          24333f8a63b6825ea9c5514f83c2829b004d1fee
          EOF

      - name: Configure Android SDK path
        run: printf "sdk.dir=%s\n" "$ANDROID_HOME" > local.properties
      - name: Configure ARM64 AAPT2
        working-directory: .
        run: |
          HOME=/data/data/com.termux/files/home bash scripts/setup-termux-aapt2.sh
          printf 'AAPT2_WRAPPER=/data/data/com.termux/files/home/.local/bin/aapt2\n' >> "$GITHUB_ENV"
      - run: chmod +x gradlew
      - run: bash ./gradlew --version
      - run: bash ./gradlew -Pandroid.aapt2FromMavenOverride="$AAPT2_WRAPPER" -PREOWN_PROJECT_ID="${{ secrets.REOWN_PROJECT_ID }}" -Dorg.gradle.workers.max=2 assembleDebug --offline --console=plain --stacktrace
      - run: |
          set -eu
          test -s app/build/outputs/apk/debug/app-debug.apk
          target="/sdcard/Download/LudoMada-premium-gles3-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$target"
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee /sdcard/Download/LudoMada-premium-gles3-debug.sha256

