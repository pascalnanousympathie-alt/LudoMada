name: Build Ludo Madagascar APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 20
    concurrency:
      group: android-apk-${{ github.ref }}
      cancel-in-progress: true
    env:
      ANDROID_HOME: /data/data/com.termux/files/home/android-sdk
      ANDROID_SDK_ROOT: /data/data/com.termux/files/home/android-sdk
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - run: sh ./gradlew --version
      - run: sh ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: LudoMadagascar-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

