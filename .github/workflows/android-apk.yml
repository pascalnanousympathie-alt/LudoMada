name: Build Ludo Madagascar APK (Termux Manual Fallback)

on:
  # Manual fallback only; automatic builds use the hosted Android emulator workflow.
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 30
    concurrency:
      group: android-apk-${{ github.ref }}
      cancel-in-progress: true
    env:
      ANDROID_HOME: /data/data/com.termux/files/home/android-sdk
      ANDROID_SDK_ROOT: /data/data/com.termux/files/home/android-sdk
      JAVA_HOME: /data/data/com.termux/files/usr/lib/jvm/java-21-openjdk
    defaults:
      run:
        working-directory: ${{ github.workspace }}/_runs/${{ github.run_id }}/android-app
    steps:
      - name: Checkout source from GitHub
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true
          path: _runs/${{ github.run_id }}

      - name: Verify and repair checked-out sources
        working-directory: ${{ github.workspace }}/_runs/${{ github.run_id }}
        run: |
          set -eu
          git reset --hard "$GITHUB_SHA"
          git clean -fdx
          # Rehydrate the exact tracked tree from Git's object database. This protects the
          # single self-hosted runner from a previously interrupted job leaving a partial tree.
          git archive "$GITHUB_SHA" | tar -xf - -C "${{ github.workspace }}/_runs/${{ github.run_id }}"
          test -f android-app/settings.gradle.kts
          test -f android-app/gradlew
          test -f android-app/build.gradle.kts

      - name: Accept Android SDK licenses
        working-directory: ${{ github.workspace }}/_runs/${{ github.run_id }}
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          cat > "$ANDROID_HOME/licenses/android-sdk-license" <<'EOF'
          8933bad161af4178b1185d1a37fbf41ea5269c55
          d56f5187479451eabf01fb78af6dfcb131a6481e
          24333f8a63b6825ea9c5514f83c2829b004d1fee
          EOF

      - name: Configure Android SDK path
        run: printf "sdk.dir=%s\n" "$ANDROID_HOME" > local.properties
      - name: Configure ARM64 AAPT2
        working-directory: ${{ github.workspace }}/_runs/${{ github.run_id }}
        run: |
          HOME=/data/data/com.termux/files/home bash scripts/setup-termux-aapt2.sh
          printf 'AAPT2_WRAPPER=/data/data/com.termux/files/home/.local/bin/aapt2\n' >> "$GITHUB_ENV"
      - run: chmod +x gradlew
      - run: bash ./gradlew -Pandroid.aapt2FromMavenOverride="$AAPT2_WRAPPER" -PREOWN_PROJECT_ID="${{ secrets.REOWN_PROJECT_ID }}" --no-daemon --no-parallel -Dorg.gradle.workers.max=1 assembleDebug --console=plain --stacktrace
      - name: Save APK to Android Downloads when mounted
        run: |
          set -eu
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          sha256sum "$apk" > ../LudoMada-premium-gles3-debug.sha256
          for target_dir in /sdcard/Download /storage/emulated/0/Download "$HOME/storage/downloads"; do
            if [ -d "$target_dir" ] && [ -w "$target_dir" ]; then
              cp "$apk" "$target_dir/LudoMada-premium-gles3-debug.apk"
              cp ../LudoMada-premium-gles3-debug.sha256 "$target_dir/LudoMada-premium-gles3-debug.sha256"
              echo "APK_COPIED_TO=$target_dir"
              exit 0
            fi
          done
          echo "ANDROID_DOWNLOADS_NOT_MOUNTED: APK will be provided as a workflow artifact."

      - name: Upload debug APK and checksum
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: LudoMada-premium-gles3-debug-${{ github.sha }}
          path: |
            _runs/${{ github.run_id }}/android-app/app/build/outputs/apk/debug/app-debug.apk
            _runs/${{ github.run_id }}/android-app/app/build/outputs/apk/debug/output-metadata.json
            _runs/${{ github.run_id }}/LudoMada-premium-gles3-debug.sha256
          if-no-files-found: warn
          retention-days: 7

