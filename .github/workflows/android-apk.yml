name: Build Ludo Madagascar APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - 'scripts/setup-termux-aapt2.sh'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 20
    concurrency:
      group: android-apk-${{ github.ref }}
      cancel-in-progress: true
    env:
      ANDROID_HOME: /data/data/com.termux/files/home/android-sdk
      ANDROID_SDK_ROOT: /data/data/com.termux/files/home/android-sdk
      JAVA_HOME: /data/data/com.termux/files/usr/lib/jvm/java-21-openjdk
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - name: Configure Android SDK path
        working-directory: android-app
        run: printf "sdk.dir=%s\\n" "$ANDROID_HOME" > local.properties
      - name: Configure ARM64 AAPT2
        working-directory: .
        run: |
          HOME=/data/data/com.termux/files/home bash scripts/setup-termux-aapt2.sh
          printf 'AAPT2_WRAPPER=/data/data/com.termux/files/home/.local/bin/aapt2\n' >> "$GITHUB_ENV"

      - run: sh ./gradlew --version
 - run: sh ./gradlew -Pandroid.aapt2FromMavenOverride="$AAPT2_WRAPPER" -PREOWN_PROJECT_ID="${{ secrets.REOWN_PROJECT_ID }}" -Dorg.gradle.workers.max=2 assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: LudoMadagascar-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
