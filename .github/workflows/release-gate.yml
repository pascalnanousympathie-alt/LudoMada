name: LudoMada Release Gate

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-staging:
    runs-on: [self-hosted, linux, ARM64]
    env:
      DATABASE_URL: postgresql://u0_a214@127.0.0.1:5432/ludomada_ci
      NODE_ENV: staging
      PORT: 3101
      JAVA_HOME: /data/data/com.termux/files/usr/lib/jvm/java-21-openjdk
      NODE_OPTIONS: --max-old-space-size=256
      npm_config_maxsockets: "1"
      npm_config_jobs: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      JWT_SECRET: "release-gate-${{ github.sha }}-staging"
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - name: Use runner Linux Node
        run: echo "/data/data/com.termux/files/home/actions-runner/externals/node24/bin" >> "$GITHUB_PATH"
      - run: node -v && npm -v
      - run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund --omit=optional
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run test:all
      - run: npm run build
      - name: Start staging API
        run: |
          nohup npm run start:prod > /tmp/ludomada-api.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:3101/ready && break; sleep 2; done
          curl -fsS http://127.0.0.1:3101/health
      - name: Run staging load smoke
        run: npx artillery run loadtests/artillery/loadtest-health-80rps.yml
      - name: Upload API log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-api-log
          path: /tmp/ludomada-api.log
          if-no-files-found: ignore

  android-final:
    needs: backend-staging
    runs-on: [self-hosted, linux, ARM64]
    env:
      ANDROID_HOME: /data/data/com.termux/files/home/android-sdk
      ANDROID_SDK_ROOT: /data/data/com.termux/files/home/android-sdk
      JAVA_HOME: /data/data/com.termux/files/usr/lib/jvm/java-21-openjdk
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - name: Configure Android SDK path
        working-directory: android-app
        run: printf "sdk.dir=%s\\n" "$ANDROID_HOME" > local.properties
      - run: java -version
      - name: Prepare release signing (when secrets are configured)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        run: |
          set -eu
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ludomada-release.jks"
          test -s "$RUNNER_TEMP/ludomada-release.jks"

      - name: Build final test APK
        working-directory: android-app
        env:
          LUDOMADA_SIGNING_STORE_FILE: ${{ runner.temp }}/ludomada-release.jks
          LUDOMADA_SIGNING_STORE_PASSWORD: ${{ env.ANDROID_KEYSTORE_PASSWORD }}
          LUDOMADA_SIGNING_KEY_ALIAS: ${{ env.ANDROID_KEY_ALIAS }}
          LUDOMADA_SIGNING_KEY_PASSWORD: ${{ env.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          chmod +x gradlew
          sh ./gradlew -Pandroid.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2 -Dorg.gradle.workers.max=2 clean assembleDebug assembleRelease test --stacktrace
          test -f app/build/outputs/apk/release/app-release-unsigned.apk || test -f app/build/outputs/apk/release/app-release.apk
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Legacy signing step (Gradle already signs release APK)
        if: ${{ false }}
        working-directory: android-app
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/ludomada-release.jks
        run: |
          set -eu
          unsigned_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          signed_apk="app/build/outputs/apk/release/app-release.apk"
          apksigner="/data/data/com.termux/files/usr/bin/apksigner"
          if [ ! -x "$apksigner" ]; then
            apksigner="$(find "$ANDROID_HOME" -type f -name apksigner -print -quit)"
          fi
          test -n "$apksigner"
          test -s "$KEYSTORE_FILE"
          test -s "$unsigned_apk"
          "$apksigner" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "env:ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "env:ANDROID_KEY_PASSWORD" \
            --out "$signed_apk" \
            "$unsigned_apk"
          test -s "$signed_apk"
          rm -f "$unsigned_apk"

      - name: Verify release artifact and signing state
        working-directory: android-app
        run: |
          set -eu
          release_apk="app/build/outputs/apk/release/app-release.apk"
          unsigned_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          apksigner="/data/data/com.termux/files/usr/bin/apksigner"
          if [ ! -x "$apksigner" ]; then
            apksigner="$(find "$ANDROID_HOME" -type f -name apksigner -print -quit)"
          fi
          test -n "$apksigner"
          if [ "$ANDROID_KEYSTORE_BASE64" != "" ] && [ "$ANDROID_KEYSTORE_PASSWORD" != "" ] && [ "$ANDROID_KEY_ALIAS" != "" ] && [ "$ANDROID_KEY_PASSWORD" != "" ]; then
            test -f "$release_apk"
            "$apksigner" verify --verbose --print-certs "$release_apk"
            sha256sum "$release_apk"
            echo "RELEASE_SIGNED=true"
          else
            test -f "$unsigned_apk"
            sha256sum "$unsigned_apk"
            echo "RELEASE_SIGNED=false (configure GitHub signing secrets for a signed release)"
          fi
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: LudoMada-release-apk
          path: android-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  android-emulator-smoke:
    if: ${{ false }}
    runs-on: [self-hosted, linux, ARM64]
    needs: android-final
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - run: java -version
      - name: Build instrumentation APKs
        working-directory: android-app
        run: sh ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data
          script: sh scripts/emulator-smoke.sh
