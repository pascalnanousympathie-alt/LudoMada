name: LudoMada Release Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "prisma/**"
      - "android-app/**"
      - "scripts/**"
      - "loadtests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/release-gate.yml"

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ludomada_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ludomada_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ludomada_ci?schema=public
      NODE_ENV: staging
      PORT: 3101
      NODE_OPTIONS: --max-old-space-size=768
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      JWT_SECRET: release-gate-${{ github.sha }}-staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - name: Install backend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate Prisma client and migrate staging database
        run: |
          set -eu
          npm run db:generate
          npm run db:migrate

      - name: Run full backend test suite
        run: npm run test:all

      - name: Build backend
        run: npm run build

      - name: Start staging API and verify readiness
        run: |
          set -eu
          nohup npm run start:prod > "$RUNNER_TEMP/ludomada-api.log" 2>&1 &
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3101/ready; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Staging API did not become ready"
            tail -n 160 "$RUNNER_TEMP/ludomada-api.log" || true
            exit 1
          fi
          curl -fsS http://127.0.0.1:3101/health

      - name: Seed disposable CI native-test accounts
        run: node scripts/seed-native-test-users.mjs

      - name: Run native HTTP, 4-player, concurrency and idempotency tests
        run: npm run test:native

      - name: Run staging load smoke
        run: npm exec -- artillery run loadtests/artillery/loadtest-health-80rps.yml

      - name: Upload API log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-api-log-${{ github.run_id }}
          path: ${{ runner.temp }}/ludomada-api.log
          if-no-files-found: ignore
          retention-days: 7

  android-final:
    needs: backend-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ORG_GRADLE_PROJECT_REOWN_PROJECT_ID: ${{ secrets.REOWN_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Set up Node.js for 3D asset verification
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Verify bundled 3D scene manifest and mobile budgets
        run: |
          set -eu
          node scripts/check-3d-assets.mjs
          node scripts/check-3d-optimization.mjs

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Configure Android SDK path
        working-directory: android-app
        run: printf "sdk.dir=%s\\n" "$ANDROID_HOME" > local.properties

      - name: Prepare release signing (only when all secrets are configured)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        run: |
          set -eu
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ludomada-release.jks"
          test -s "$RUNNER_TEMP/ludomada-release.jks"

      - name: Build debug, release, instrumentation APKs and unit tests
        working-directory: android-app
        env:
          LUDOMADA_SIGNING_STORE_FILE: ${{ runner.temp }}/ludomada-release.jks
          LUDOMADA_SIGNING_STORE_PASSWORD: ${{ env.ANDROID_KEYSTORE_PASSWORD }}
          LUDOMADA_SIGNING_KEY_ALIAS: ${{ env.ANDROID_KEY_ALIAS }}
          LUDOMADA_SIGNING_KEY_PASSWORD: ${{ env.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          chmod +x gradlew
          ./gradlew clean test assembleDebug assembleDebugAndroidTest assembleRelease --no-daemon --no-parallel -Dorg.gradle.workers.max=2 --console=plain --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk || test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify release artifact and signing state
        working-directory: android-app
        run: |
          set -eu
          node ../scripts/check-apk-3d-asset.mjs app/build/outputs/apk/debug/app-debug.apk
          release_apk="app/build/outputs/apk/release/app-release.apk"
          unsigned_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$apksigner"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            test -s "$release_apk"
            "$apksigner" verify --verbose --print-certs "$release_apk"
            node ../scripts/check-apk-3d-asset.mjs "$release_apk"
            sha256sum "$release_apk"
            echo "RELEASE_SIGNED=true"
          else
            test -s "$unsigned_apk"
            node ../scripts/check-apk-3d-asset.mjs "$unsigned_apk"
            sha256sum "$unsigned_apk"
            echo "RELEASE_SIGNED=false (configure GitHub signing secrets for a signed release)"
          fi

      - name: Upload verified Android APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LudoMada-release-gate-${{ github.sha }}
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            android-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            android-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
