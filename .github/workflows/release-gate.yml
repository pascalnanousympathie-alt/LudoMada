name: LudoMada Release Gate

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-staging:
    runs-on: [self-hosted, linux, ARM64]
    env:
      DATABASE_URL: postgresql://ludomada_test:ludomada_test@127.0.0.1:54329/ludomada_test?schema=staging
      NODE_ENV: staging
      PORT: 3101
      JAVA_HOME: /data/data/com.termux/files/usr/lib/jvm/java-21-openjdk
      NODE_OPTIONS: --max-old-space-size=256
      npm_config_maxsockets: "1"
      npm_config_jobs: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      JWT_SECRET: "release-gate-${{ github.sha }}-staging"
    steps:
      - name: Checkout source from local runner mirror
        working-directory: .
        run: |
          set -eu
          src="/home/runner/ludomada-mirror.git"
          test -d "$src"
          git --git-dir="$src" cat-file -e "$GITHUB_SHA^{commit}"
          rm -rf "$GITHUB_WORKSPACE"
          git clone --no-hardlinks "$src" "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" checkout --detach "$GITHUB_SHA"

      - name: Use Termux Node
        run: |
          set -eu
          mkdir -p "$HOME/.ci-node-bin"
          cat > "$HOME/.ci-node-bin/node" <<'EOF'
          #!/bin/sh
          export LD_LIBRARY_PATH=/data/data/com.termux/files/usr/lib
          exec /data/data/com.termux/files/usr/bin/node "$@"
          EOF
          cat > "$HOME/.ci-node-bin/npm" <<'EOF'
          #!/bin/sh
          export LD_LIBRARY_PATH=/data/data/com.termux/files/usr/lib
          exec /data/data/com.termux/files/usr/bin/node /data/data/com.termux/files/usr/bin/npm "$@"
          EOF
          cat > "$HOME/.ci-node-bin/npx" <<'EOF'
          #!/bin/sh
          export LD_LIBRARY_PATH=/data/data/com.termux/files/usr/lib
          exec /data/data/com.termux/files/usr/bin/node /data/data/com.termux/files/usr/bin/npx "$@"
          EOF
          chmod +x "$HOME/.ci-node-bin/node" "$HOME/.ci-node-bin/npm" "$HOME/.ci-node-bin/npx"
          echo "PATH=$HOME/.ci-node-bin:/data/data/com.termux/files/usr/bin:$PATH" >> "$GITHUB_ENV"
      - run: node -v && npm -v
      - name: Start isolated PostgreSQL
        run: bash scripts/ensure-test-postgres.sh
      - name: Prepare persistent dependencies
        run: |
          set -eu
          source_dir="/data/data/com.termux/files/home/LudoMada/node_modules"
          test -d "$source_dir"
          expected_lock="$(sha256sum package-lock.json | awk '{print $1}')"
          source_lock="$(sha256sum "/data/data/com.termux/files/home/LudoMada/package-lock.json" | awk '{print $1}')"
          test "$expected_lock" = "$source_lock"
          test -f "$source_dir/.package-lock.json"
          if [ -L node_modules ] || [ -d node_modules ]; then
            rm -rf node_modules
          fi
          ln -s "$source_dir" node_modules
          node -e "require('@prisma/client'); require('jest'); require('typescript'); require('fs').accessSync('node_modules/prisma/build/index.js'); console.log('DEPS_CORE_OK')"
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run test:all
      - run: npm run build
      - name: Start staging API
        run: |
          nohup npm run start:prod > /tmp/ludomada-api.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:3101/ready && break; sleep 2; done
          curl -fsS http://127.0.0.1:3101/health
      - name: Run staging load smoke
        run: npx artillery run loadtests/artillery/loadtest-health-80rps.yml
      - name: Save API log locally
        if: always()
        run: cp /tmp/ludomada-api.log "$HOME/LudoMada-staging-api.log" 2>/dev/null || true

  android-final:
    needs: backend-staging
    runs-on: [self-hosted, linux, ARM64]
    env:
      ANDROID_HOME: /data/data/com.termux/files/home/android-sdk
      ANDROID_SDK_ROOT: /data/data/com.termux/files/home/android-sdk
      JAVA_HOME: /data/data/com.termux/files/usr/lib/jvm/java-21-openjdk
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout source from local runner mirror
        working-directory: .
        run: |
          set -eu
          src="/home/runner/ludomada-mirror.git"
          test -d "$src"
          git --git-dir="$src" cat-file -e "$GITHUB_SHA^{commit}"
          rm -rf "$GITHUB_WORKSPACE"
          git clone --no-hardlinks "$src" "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" checkout --detach "$GITHUB_SHA"

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          cat > "$ANDROID_HOME/licenses/android-sdk-license" <<'EOF'
          8933bad161af4178b1185d1a37fbf41ea5269c55
          d56f5187479451eabf01fb78af6dfcb131a6481e
          24333f8a63b6825ea9c5514f83c2829b004d1fee
          EOF

      - name: Configure Android SDK path
        working-directory: android-app
        run: printf "sdk.dir=%s\\n" "$ANDROID_HOME" > local.properties
      - name: Configure ARM64 AAPT2
        run: bash scripts/setup-termux-aapt2.sh
      - run: java -version
      - name: Prepare release signing (when secrets are configured)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        run: |
          set -eu
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ludomada-release.jks"
          test -s "$RUNNER_TEMP/ludomada-release.jks"

      - name: Build final test APK
        working-directory: android-app
        env:
          LUDOMADA_SIGNING_STORE_FILE: ${{ runner.temp }}/ludomada-release.jks
          LUDOMADA_SIGNING_STORE_PASSWORD: ${{ env.ANDROID_KEYSTORE_PASSWORD }}
          LUDOMADA_SIGNING_KEY_ALIAS: ${{ env.ANDROID_KEY_ALIAS }}
          LUDOMADA_SIGNING_KEY_PASSWORD: ${{ env.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          chmod +x gradlew
          bash ./gradlew -Pandroid.aapt2FromMavenOverride="$AAPT2_WRAPPER" -PREOWN_PROJECT_ID="${{ secrets.REOWN_PROJECT_ID }}" -Dorg.gradle.workers.max=2 clean assembleDebug assembleRelease test --stacktrace
          test -f app/build/outputs/apk/release/app-release-unsigned.apk || test -f app/build/outputs/apk/release/app-release.apk
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Legacy signing step (Gradle already signs release APK)
        if: ${{ false }}
        working-directory: android-app
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/ludomada-release.jks
        run: |
          set -eu
          unsigned_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          signed_apk="app/build/outputs/apk/release/app-release.apk"
          apksigner="/data/data/com.termux/files/usr/bin/apksigner"
          if [ ! -x "$apksigner" ]; then
            apksigner="$(find "$ANDROID_HOME" -type f -name apksigner -print -quit)"
          fi
          test -n "$apksigner"
          test -s "$KEYSTORE_FILE"
          test -s "$unsigned_apk"
          "$apksigner" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "env:ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "env:ANDROID_KEY_PASSWORD" \
            --out "$signed_apk" \
            "$unsigned_apk"
          test -s "$signed_apk"
          rm -f "$unsigned_apk"

      - name: Verify release artifact and signing state
        working-directory: android-app
        run: |
          set -eu
          release_apk="app/build/outputs/apk/release/app-release.apk"
          unsigned_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          apksigner="/data/data/com.termux/files/usr/bin/apksigner"
          if [ ! -x "$apksigner" ]; then
            apksigner="$(find "$ANDROID_HOME" -type f -name apksigner -print -quit)"
          fi
          test -n "$apksigner"
          if [ "$ANDROID_KEYSTORE_BASE64" != "" ] && [ "$ANDROID_KEYSTORE_PASSWORD" != "" ] && [ "$ANDROID_KEY_ALIAS" != "" ] && [ "$ANDROID_KEY_PASSWORD" != "" ]; then
            test -f "$release_apk"
            "$apksigner" verify --verbose --print-certs "$release_apk"
            sha256sum "$release_apk"
            echo "RELEASE_SIGNED=true"
          else
            test -f "$unsigned_apk"
            sha256sum "$unsigned_apk"
            echo "RELEASE_SIGNED=false (configure GitHub signing secrets for a signed release)"
          fi
      - name: Save release APK locally
        run: |
          set -eu
          for apk in android-app/app/build/outputs/apk/release/*.apk; do test -s "$apk" && cp "$apk" "/sdcard/Download/$(basename "$apk")"; done

  android-emulator-smoke:
    if: ${{ false }}
    runs-on: [self-hosted, linux, ARM64]
    needs: android-final
    steps:
      - name: Checkout source from local runner mirror
        working-directory: .
        run: |
          set -eu
          src="/home/runner/ludomada-mirror.git"
          test -d "$src"
          git --git-dir="$src" cat-file -e "$GITHUB_SHA^{commit}"
          rm -rf "$GITHUB_WORKSPACE"
          git clone --no-hardlinks "$src" "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" checkout --detach "$GITHUB_SHA"

      - run: java -version
      - name: Build instrumentation APKs
        working-directory: android-app
        run: bash ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data
          script: sh scripts/emulator-smoke.sh
