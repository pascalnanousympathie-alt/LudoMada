name: LudoMada Release Gate

on:
  workflow_dispatch:
    inputs:
      run_capacity_test:
        description: "Run isolated authenticated game-state capacity test up to 10k RPS"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "prisma/**"
      - "android-app/**"
      - "loadtests/**"
      - "docs/PERFORMANCE_CAPACITY_10K.md"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/release-gate.yml"

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ludomada_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ludomada_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ludomada_ci?schema=public
      NODE_ENV: staging
      PORT: 3101
      NODE_OPTIONS: --max-old-space-size=768
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      JWT_SECRET: release-gate-${{ github.sha }}-staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - name: Install backend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate Prisma client and migrate staging database
        run: |
          set -eu
          npm run db:generate
          npm run db:migrate

      - name: Run full backend test suite
        run: npm run test:all

      - name: Build backend
        run: npm run build

      - name: Test capacity diagnostics and report validator
        run: |
          node --check scripts/profile-capacity-state-query.mjs
          node --test scripts/validate-capacity-report.test.mjs

      - name: Start staging API and verify readiness
        env:
          LUDOMADA_LOAD_TEST_MODE: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_capacity_test) || (github.event_name == 'pull_request' && github.head_ref == 'perf/game-state-10k-capacity-gate-20261031') }}
          LUDOMADA_PG_POOL_DIAGNOSTICS: ${{ ((github.event_name == 'workflow_dispatch' && inputs.run_capacity_test) || (github.event_name == 'pull_request' && github.head_ref == 'perf/game-state-10k-capacity-gate-20261031')) && 'true' || 'false' }}
          LUDOMADA_GAME_STATE_CACHE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.run_capacity_test) || (github.event_name == 'pull_request' && github.head_ref == 'perf/game-state-10k-capacity-gate-20261031')) && 'true' || 'false' }}
          LUDOMADA_CAPACITY_RUNTIME_TELEMETRY: ${{ ((github.event_name == 'workflow_dispatch' && inputs.run_capacity_test) || (github.event_name == 'pull_request' && github.head_ref == 'perf/game-state-10k-capacity-gate-20261031')) && 'true' || 'false' }}
          CAPACITY_CPU_PROFILE_ENABLED: ${{ ((github.event_name == 'workflow_dispatch' && inputs.run_capacity_test) || (github.event_name == 'pull_request' && github.head_ref == 'perf/game-state-10k-capacity-gate-20261031')) && 'true' || 'false' }}
          PG_POOL_MAX: ${{ ((github.event_name == 'workflow_dispatch' && inputs.run_capacity_test) || (github.event_name == 'pull_request' && github.head_ref == 'perf/game-state-10k-capacity-gate-20261031')) && '60' || '5' }}
        run: |
          set -eu
          if [ "$CAPACITY_CPU_PROFILE_ENABLED" = "true" ]; then
            mkdir -p "$RUNNER_TEMP/ludomada-cpu-profile"
            nohup node --cpu-prof --cpu-prof-dir="$RUNNER_TEMP/ludomada-cpu-profile" dist/server.js > "$RUNNER_TEMP/ludomada-api.log" 2>&1 &
          else
            nohup npm run start:prod > "$RUNNER_TEMP/ludomada-api.log" 2>&1 &
          fi
          api_pid=$!
          printf '%s\n' "$api_pid" > "$RUNNER_TEMP/ludomada-api.pid"
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3101/ready; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Staging API did not become ready"
            tail -n 160 "$RUNNER_TEMP/ludomada-api.log" || true
            exit 1
          fi
          curl -fsS http://127.0.0.1:3101/health

      - name: Run staging load smoke
        run: npm exec -- artillery run loadtests/artillery/loadtest-health-80rps.yml

      - name: Seed disposable authenticated game-state capacity fixtures
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_capacity_test) || (github.event_name == 'pull_request' && github.head_ref == 'perf/game-state-10k-capacity-gate-20261031') }}
        env:
          LUDOMADA_LOAD_TEST_MODE: "true"
        run: node scripts/seed-capacity-test-fixtures.mjs

      - name: Capture authenticated game-state SQL plan on disposable database
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_capacity_test) || (github.event_name == 'pull_request' && github.head_ref == 'perf/game-state-10k-capacity-gate-20261031') }}
        env:
          LUDOMADA_LOAD_TEST_MODE: "true"
        run: node scripts/profile-capacity-state-query.mjs loadtests/artillery/capacity-fixtures.csv "$RUNNER_TEMP"

      - name: Warm up participant-authorized game-state read cache
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_capacity_test) || (github.event_name == 'pull_request' && github.head_ref == 'perf/game-state-10k-capacity-gate-20261031') }}
        run: npm exec -- artillery run loadtests/artillery/loadtest-game-state-warmup.yml

      - name: Run authenticated game-state capacity profile (up to 10k RPS)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_capacity_test) || (github.event_name == 'pull_request' && github.head_ref == 'perf/game-state-10k-capacity-gate-20261031') }}
        run: |
          printf "RUNNER_NPROC="; getconf _NPROCESSORS_ONLN
          printf "RUNNER_ULIMIT_SOFT="; ulimit -Sn
          printf "RUNNER_ULIMIT_HARD="; ulimit -Hn
          printf "RUNNER_EPHEMERAL_PORT_RANGE="; cat /proc/sys/net/ipv4/ip_local_port_range
          printf "RUNNER_FILE_MAX="; cat /proc/sys/fs/file-max
          printf "RUNNER_LOADAVG="; cat /proc/loadavg
          free -h
          soft_limit=$(ulimit -Sn)
          hard_limit=$(ulimit -Hn)
          desired_limit=16384
          if [ "$hard_limit" != "unlimited" ] && [ "$hard_limit" -lt "$desired_limit" ]; then desired_limit="$hard_limit"; fi
          if [ "$soft_limit" != "unlimited" ] && [ "$soft_limit" -lt "$desired_limit" ]; then ulimit -n "$desired_limit"; fi
          printf "ARTILLERY_ULIMIT_EFFECTIVE="; ulimit -Sn
          set +e
          npm exec -- artillery run --output "$RUNNER_TEMP/ludomada-game-state-capacity.json" loadtests/artillery/loadtest-game-state-10krps.yml
          artillery_exit=$?
          printf "RUNNER_SOCKET_SUMMARY_AFTER_TEST\n"
          ss -s || true
          exit "$artillery_exit"

      - name: Stop capacity API gracefully and finalize CPU profile
        if: ${{ always() && ((github.event_name == 'workflow_dispatch' && inputs.run_capacity_test) || (github.event_name == 'pull_request' && github.head_ref == 'perf/game-state-10k-capacity-gate-20261031')) }}
        run: |
          set -eu
          if [ -s "$RUNNER_TEMP/ludomada-api.pid" ]; then
            api_pid="$(cat "$RUNNER_TEMP/ludomada-api.pid")"
            kill -TERM "$api_pid" 2>/dev/null || true
            stopped=0
            for _ in $(seq 1 20); do
              if ! kill -0 "$api_pid" 2>/dev/null; then
                stopped=1
                break
              fi
              sleep 1
            done
            if [ "$stopped" -ne 1 ]; then
              echo "Capacity API did not finish graceful shutdown within 20 seconds"
              exit 1
            fi
          fi
          profile_count="$(find "$RUNNER_TEMP/ludomada-cpu-profile" -maxdepth 1 -type f -name '*.cpuprofile' -size +0c 2>/dev/null | wc -l | tr -d ' ')"
          printf 'CAPACITY_CPU_PROFILE_COUNT=%s\n' "$profile_count"
          test "$profile_count" -ge 1

      - name: Independently validate measured capacity and SLOs
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_capacity_test) || (github.event_name == 'pull_request' && github.head_ref == 'perf/game-state-10k-capacity-gate-20261031') }}
        run: node scripts/validate-capacity-report.mjs "$RUNNER_TEMP/ludomada-game-state-capacity.json"

      - name: Upload game-state capacity report
        if: ${{ always() && ((github.event_name == 'workflow_dispatch' && inputs.run_capacity_test) || (github.event_name == 'pull_request' && github.head_ref == 'perf/game-state-10k-capacity-gate-20261031')) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ludomada-game-state-capacity-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ludomada-game-state-capacity.json
            ${{ runner.temp }}/ludomada-query-plan.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove temporary capacity fixtures and JWT
        if: ${{ always() && ((github.event_name == 'workflow_dispatch' && inputs.run_capacity_test) || (github.event_name == 'pull_request' && github.head_ref == 'perf/game-state-10k-capacity-gate-20261031')) }}
        run: rm -f loadtests/artillery/capacity-fixtures.csv

      - name: Upload guarded Node CPU profile
        if: ${{ always() && ((github.event_name == 'workflow_dispatch' && inputs.run_capacity_test) || (github.event_name == 'pull_request' && github.head_ref == 'perf/game-state-10k-capacity-gate-20261031')) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ludomada-node-cpu-profile-${{ github.run_id }}
          path: ${{ runner.temp }}/ludomada-cpu-profile/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload API log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-api-log-${{ github.run_id }}
          path: ${{ runner.temp }}/ludomada-api.log
          if-no-files-found: ignore
          retention-days: 7

  android-final:
    needs: backend-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ORG_GRADLE_PROJECT_REOWN_PROJECT_ID: ${{ secrets.REOWN_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Configure Android SDK path
        working-directory: android-app
        run: printf "sdk.dir=%s\\n" "$ANDROID_HOME" > local.properties

      - name: Prepare release signing (only when all secrets are configured)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        run: |
          set -eu
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ludomada-release.jks"
          test -s "$RUNNER_TEMP/ludomada-release.jks"

      - name: Build debug, release, instrumentation APKs and unit tests
        working-directory: android-app
        env:
          LUDOMADA_SIGNING_STORE_FILE: ${{ runner.temp }}/ludomada-release.jks
          LUDOMADA_SIGNING_STORE_PASSWORD: ${{ env.ANDROID_KEYSTORE_PASSWORD }}
          LUDOMADA_SIGNING_KEY_ALIAS: ${{ env.ANDROID_KEY_ALIAS }}
          LUDOMADA_SIGNING_KEY_PASSWORD: ${{ env.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          chmod +x gradlew
          ./gradlew clean test assembleDebug assembleDebugAndroidTest assembleRelease --no-daemon --no-parallel -Dorg.gradle.workers.max=2 --console=plain --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk || test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify release artifact and signing state
        working-directory: android-app
        run: |
          set -eu
          release_apk="app/build/outputs/apk/release/app-release.apk"
          unsigned_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$apksigner"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            test -s "$release_apk"
            "$apksigner" verify --verbose --print-certs "$release_apk"
            sha256sum "$release_apk"
            echo "RELEASE_SIGNED=true"
          else
            test -s "$unsigned_apk"
            sha256sum "$unsigned_apk"
            echo "RELEASE_SIGNED=false (configure GitHub signing secrets for a signed release)"
          fi

      - name: Upload verified Android APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LudoMada-release-gate-${{ github.sha }}
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            android-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            android-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
