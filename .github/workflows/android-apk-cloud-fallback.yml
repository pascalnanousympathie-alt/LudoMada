name: Android APK Cloud Fallback

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - "scripts/ramus-smoke.mjs"
      - "scripts/audit-material-calibration.mjs"
      - "scripts/check-3d-assets.mjs"
      - "scripts/check-glb-runtime-transform.mjs"
      - "scripts/check-apk-3d-asset.mjs"
      - "scripts/check-ramus-wallet-hitbox.mjs"
      - ".github/workflows/lane-f-premium-gate.yml"
      - ".github/workflows/android-apk-cloud-fallback.yml"
  pull_request:
    paths:
      - "android-app/**"
      - "scripts/ramus-smoke.mjs"
      - "scripts/audit-material-calibration.mjs"
      - "scripts/check-3d-assets.mjs"
      - "scripts/check-glb-runtime-transform.mjs"
      - "scripts/check-apk-3d-asset.mjs"
      - "scripts/check-ramus-wallet-hitbox.mjs"
      - ".github/workflows/lane-f-premium-gate.yml"
      - ".github/workflows/android-apk-cloud-fallback.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    concurrency:
      group: android-apk-cloud-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: platform-tools platforms;android-35 build-tools;35.0.0 emulator system-images;android-35;google_apis;x86_64

      - name: Build debug and instrumentation APKs, and run JVM unit tests
        env:
          ORG_GRADLE_PROJECT_REOWN_PROJECT_ID: ${{ secrets.REOWN_PROJECT_ID }}
        run: |
          set -eu
          chmod +x gradlew
          ./gradlew test assembleDebug assembleDebugAndroidTest --no-daemon --no-parallel -Dorg.gradle.workers.max=2 --console=plain --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Audit Android source policy
        working-directory: .
        run: python3 scripts/android-release-audit.py

      - name: Validate 3D asset manifest and mobile budgets
        working-directory: .
        run: |
          set -eu
          node scripts/check-3d-assets.mjs
          node scripts/check-3d-optimization.mjs

      - name: Verify current GLB and textures are packaged into debug APK
        working-directory: .
        run: node scripts/check-apk-3d-asset.mjs android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Scan debug and instrumentation APKs for known embedded credentials
        working-directory: .
        run: |
          set -eu
          python3 scripts/android-release-audit.py android-app/app/build/outputs/apk/debug/app-debug.apk
          python3 scripts/android-release-audit.py android-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Check Ramus test script syntax
        working-directory: .
        run: node --check scripts/ramus-smoke.mjs

      - name: Run 2P/3P/4P UI smoke on hosted Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 900
          disk-size: 4096M
          ram-size: 2048M
          heap-size: 512M
          sdcard-path-or-size: 256M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data
          # Use a single shell command and the exact config path observed in hosted-runner logs.
          pre-emulator-launch-script: >-
            sed -i '/^disk\.dataPartition\.size=/d' /home/runner/.android/avd/test.avd/config.ini && printf 'disk.dataPartition.size=4096M\n' >> /home/runner/.android/avd/test.avd/config.ini && grep -q '^disk.dataPartition.size=4096M
          script: |
            set +e
            cd android-app
            ./gradlew connectedDebugAndroidTest --no-daemon --no-parallel -Dorg.gradle.workers.max=2 --console=plain --stacktrace
            test_exit=$?
            cd "$GITHUB_WORKSPACE"
            mkdir -p ramus-evidence
            adb devices > ramus-evidence/adb-devices.txt 2>&1 || true
            adb logcat -d -t 3000 > ramus-evidence/logcat.txt 2>&1 || true
            adb exec-out screencap -p > ramus-evidence/hosted-emulator.png 2> ramus-evidence/screencap.err || true
            for name in ludomada-home.png ludomada-game-mode.png ludomada-wallet.png ludomada-market.png ludomada-gameplay-2p.png ludomada-gameplay-3p.png ludomada-gameplay-4p.png ludomada-startup-offline.png; do
              adb shell run-as com.ludomadagascar.test cat "cache/$name" > "ramus-evidence/$name" 2> "ramus-evidence/$name.err" || true
            done
            exit "$test_exit"

      - name: Upload hosted emulator screenshots and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LudoMada-hosted-emulator-evidence-${{ github.sha }}
          path: ramus-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Publish verified APK and instrumentation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LudoMada-premium-gles3-debug-${{ github.sha }}
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            android-app/app/build/outputs/apk/debug/output-metadata.json
            android-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: warn
          retention-days: 7
 /home/runner/.android/avd/test.avd/config.ini && grep '^disk.dataPartition.size=' /home/runner/.android/avd/test.avd/config.ini
          script: |
            set +e
            cd android-app
            ./gradlew connectedDebugAndroidTest --no-daemon --no-parallel -Dorg.gradle.workers.max=2 --console=plain --stacktrace
            test_exit=$?
            cd "$GITHUB_WORKSPACE"
            mkdir -p ramus-evidence
            adb devices > ramus-evidence/adb-devices.txt 2>&1 || true
            adb logcat -d -t 3000 > ramus-evidence/logcat.txt 2>&1 || true
            adb exec-out screencap -p > ramus-evidence/hosted-emulator.png 2> ramus-evidence/screencap.err || true
            for name in ludomada-home.png ludomada-game-mode.png ludomada-wallet.png ludomada-market.png ludomada-gameplay-2p.png ludomada-gameplay-3p.png ludomada-gameplay-4p.png ludomada-startup-offline.png; do
              adb shell run-as com.ludomadagascar.test cat "cache/$name" > "ramus-evidence/$name" 2> "ramus-evidence/$name.err" || true
            done
            exit "$test_exit"

      - name: Upload hosted emulator screenshots and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LudoMada-hosted-emulator-evidence-${{ github.sha }}
          path: ramus-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Publish verified APK and instrumentation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LudoMada-premium-gles3-debug-${{ github.sha }}
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            android-app/app/build/outputs/apk/debug/output-metadata.json
            android-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: warn
          retention-days: 7
