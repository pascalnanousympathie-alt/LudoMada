name: Android APK Cloud Fallback

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk-cloud-fallback.yml"
  pull_request:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk-cloud-fallback.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-cloud-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 emulator system-images;android-35;google_apis;x86_64"

      - name: Build, test, and compile instrumentation APK
        env:
          ORG_GRADLE_PROJECT_REOWN_PROJECT_ID: ${{ secrets.REOWN_PROJECT_ID }}
        run: |
          set -eu
          chmod +x gradlew
          printf "sdk.dir=%s\\n" "$ANDROID_HOME" > local.properties
          ./gradlew test assembleDebug assembleDebugAndroidTest --no-daemon --no-parallel -Dorg.gradle.workers.max=2 --console=plain --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Run instrumented UI tests on hosted Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 900
          disk-size: 4096M
          ram-size: 2048M
          heap-size: 512M
          sdcard-path-or-size: 256M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data
          pre-emulator-launch-script: |
            set -eu
            avd_dir="${ANDROID_AVD_HOME:-$HOME/.android/avd}/test.avd"
            config="$avd_dir/config.ini"
            test -s "$config"
            sed -i '/^disk\.dataPartition\.size=/d' "$config"
            printf 'disk.dataPartition.size=4096M\n' >> "$config"
            test "$(grep -c '^disk.dataPartition.size=4096M
      - name: Publish debug APK and instrumentation APK
        uses: actions/upload-artifact@v4
        with:
          name: LudoMada-cloud-validation-${{ github.sha }}
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            android-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            android-app/app/build/outputs/apk/debug/output-metadata.json
          if-no-files-found: error
          retention-days: 7
 "$config")" -eq 1
            echo "AVD_DATA_PARTITION_SIZE_FIXED=4096M"
            grep '^disk.dataPartition.size=' "$config"
          script: cd android-app && ./gradlew connectedDebugAndroidTest --no-daemon --no-parallel -Dorg.gradle.workers.max=2 --console=plain --stacktrace

      - name: Publish debug APK and instrumentation APK
        uses: actions/upload-artifact@v4
        with:
          name: LudoMada-cloud-validation-${{ github.sha }}
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            android-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            android-app/app/build/outputs/apk/debug/output-metadata.json
          if-no-files-found: error
          retention-days: 7
