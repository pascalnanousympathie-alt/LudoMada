name: Android Emulator UI Gate

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  emulator:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Emulator UI test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          script: |
            cd android-app
            chmod +x gradlew
            ./gradlew :app:assembleDebug :app:connectedDebugAndroidTest --stacktrace
            mkdir -p artifacts
            adb pull /sdcard/Download/ludomada-startup.png artifacts/ludomada-startup.png
      - name: Upload startup screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ludomada-emulator-screenshot
          path: android-app/artifacts/ludomada-startup.png