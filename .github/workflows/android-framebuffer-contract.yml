name: Android Framebuffer Readback Contract

on:
  push:
    paths:
      - 'scripts/ramus-smoke.mjs'
      - '.github/workflows/android-framebuffer-contract.yml'
  pull_request:
    paths:
      - 'scripts/ramus-smoke.mjs'
      - '.github/workflows/android-framebuffer-contract.yml'

permissions:
  contents: read

jobs:
  framebuffer-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Check Ramus smoke script syntax
        run: node --check scripts/ramus-smoke.mjs

      - name: Validate framebuffer readback acceptance checks
        run: node scripts/ramus-smoke.mjs --test-framebuffer-readback
