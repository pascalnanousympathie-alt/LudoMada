name: Android Emulator Automated Tests
# Premium landscape visual/gameplay validation gate

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - "scripts/ramus-smoke.mjs"
      - ".github/workflows/android-emulator-test.yml"

jobs:
  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
      ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
      JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/21.0.9-10/x64
    concurrency:
      group: ramus-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform/build tools
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Android SDK
        working-directory: android-app
        run: printf "sdk.dir=%s\n" "$ANDROID_SDK_ROOT" > local.properties

      - name: Build debug APK for Ramus
        working-directory: android-app
        run: |
          set -eu
          chmod +x gradlew
          ./gradlew --version
          ./gradlew -PREOWN_PROJECT_ID="${{ secrets.REOWN_PROJECT_ID }}" -Dorg.gradle.workers.max=2 assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Install Ramus CLI
        run: |
          set -eu
          rm -rf "$RUNNER_TEMP/ramus-cli"
          mkdir -p "$RUNNER_TEMP/ramus-cli"
          curl -fsSL https://registry.npmjs.org/ramus-cli/-/ramus-cli-0.1.13.tgz -o "$RUNNER_TEMP/ramus-cli/ramus-cli.tgz"
          tar -xzf "$RUNNER_TEMP/ramus-cli/ramus-cli.tgz" -C "$RUNNER_TEMP/ramus-cli"
          test -f "$RUNNER_TEMP/ramus-cli/package/dist/main.js"
          echo "RAMUS_CLI=$RUNNER_TEMP/ramus-cli/package/dist/main.js" >> "$GITHUB_ENV"

      - name: Run cloud Android smoke test with Ramus
        env:
          RAMUS_APK: ${{ github.workspace }}/android-app/app/build/outputs/apk/debug/app-debug.apk
          RAMUS_API_KEY: ${{ secrets.RAMUS_API_KEY }}
        run: |
          set -o pipefail
          timeout -k 10s 900s node scripts/ramus-smoke.mjs 2>&1 | tee ramus-smoke.log

      - name: Upload Ramus visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LudoMada-ramus-evidence
          path: |
            ramus-evidence/
            ramus-smoke.log
          if-no-files-found: ignore
