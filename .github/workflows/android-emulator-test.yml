name: Android Emulator Automated Tests

on:
  workflow_dispatch:
  push:
    # Workflow-only edits deliberately do not consume the cloud Android smoke-test quota.
    paths:
      - 'android-app/**'
      - 'scripts/ramus-smoke.mjs'

permissions:
  contents: read

concurrency:
  group: ramus-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Configure Android SDK
        working-directory: android-app
        run: printf "sdk.dir=%s\\n" "$ANDROID_HOME" > local.properties

      - name: Verify bundled 3D scene manifest and mobile budgets
        run: |
          set -eu
          node scripts/check-3d-assets.mjs
          node scripts/check-3d-optimization.mjs

      - name: Build debug APK
        working-directory: android-app
        run: |
          set -eu
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --no-parallel -Dorg.gradle.workers.max=2 --console=plain --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Verify 3D model is packaged in the debug APK
        run: node scripts/check-apk-3d-asset.mjs android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Install Ramus CLI
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/ramus-cli"
          curl -fsSL https://registry.npmjs.org/ramus-cli/-/ramus-cli-0.1.13.tgz \
            -o "$RUNNER_TEMP/ramus-cli/ramus-cli.tgz"
          tar -xzf "$RUNNER_TEMP/ramus-cli/ramus-cli.tgz" -C "$RUNNER_TEMP/ramus-cli"
          test -f "$RUNNER_TEMP/ramus-cli/package/dist/main.js"
          echo "RAMUS_CLI=$RUNNER_TEMP/ramus-cli/package/dist/main.js" >> "$GITHUB_ENV"

      - name: Run cloud Android smoke test with Ramus
        env:
          RAMUS_APK: ${{ github.workspace }}/android-app/app/build/outputs/apk/debug/app-debug.apk
          RAMUS_API_KEY: ${{ secrets.RAMUS_API_KEY }}
        run: |
          set -o pipefail
          node scripts/ramus-smoke.mjs 2>&1 | tee ramus-smoke.log

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LudoMadagascar-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Ramus screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ramus-android-evidence
          path: ramus-screen.jpg
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Ramus smoke log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ramus-smoke-log
          path: ramus-smoke.log
          if-no-files-found: warn
          retention-days: 7
