name: Android Emulator Automated Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - 'scripts/ramus-smoke.mjs'

jobs:
  emulator-test:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 30
    concurrency:
      group: ramus-android-${{ github.ref }}
      cancel-in-progress: true
    env:
      ANDROID_HOME: /data/data/com.termux/files/home/android-sdk
      ANDROID_SDK_ROOT: /data/data/com.termux/files/home/android-sdk
      JAVA_HOME: /data/data/com.termux/files/usr/lib/jvm/java-21-openjdk

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          clean: false
          fetch-depth: 1

      - name: Configure Android SDK
        working-directory: android-app
        run: printf "sdk.dir=%s\\n" "$ANDROID_HOME" > local.properties


      - name: Build debug APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          bash ./gradlew --no-daemon --no-parallel -Pandroid.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2 -Dorg.gradle.workers.max=2 assembleDebug --stacktrace

      - name: Install Ramus CLI
        run: |
          rm -rf "$RUNNER_TEMP/ramus-cli"
          mkdir -p "$RUNNER_TEMP/ramus-cli"
          curl -fsSL https://registry.npmjs.org/ramus-cli/-/ramus-cli-0.1.13.tgz \
            -o "$RUNNER_TEMP/ramus-cli/ramus-cli.tgz"
          tar -xzf "$RUNNER_TEMP/ramus-cli/ramus-cli.tgz" -C "$RUNNER_TEMP/ramus-cli"
          test -f "$RUNNER_TEMP/ramus-cli/package/dist/main.js"
          echo "RAMUS_CLI=$RUNNER_TEMP/ramus-cli/package/dist/main.js" >> "$GITHUB_ENV"

      - name: Run cloud Android smoke test with Ramus
        env:
          HOME: /data/data/com.termux/files/home
          RAMUS_APK: ${{ github.workspace }}/android-app/app/build/outputs/apk/debug/app-debug.apk
          RAMUS_API_KEY: ${{ secrets.RAMUS_API_KEY }}
        run: |
          set -o pipefail
          export LD_LIBRARY_PATH="/data/data/com.termux/files/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          /data/data/com.termux/files/usr/bin/node scripts/ramus-smoke.mjs 2>&1 | tee ramus-smoke.log

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LudoMadagascar-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload Ramus screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ramus-android-evidence
          path: ramus-screen.jpg
          if-no-files-found: warn

      - name: Upload Ramus smoke log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ramus-smoke-log
          path: ramus-smoke.log
          if-no-files-found: warn
