name: Android Emulator Automated Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-emulator-test.yml'

jobs:
  emulator-test:
    if: ${{ false }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK and test APK
        run: |
          chmod +x gradlew
          sh ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Run instrumented smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-boot-timeout: 1200
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data
          script: sh scripts/emulator-smoke.sh

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LudoMadagascar-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-test-reports
          path: android-app/app/build/reports/
          if-no-files-found: warn