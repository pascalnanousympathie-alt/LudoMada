name: Android Emulator Automated Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - 'scripts/ramus-smoke.mjs'
      - '.github/workflows/android-emulator-test.yml'

jobs:
  emulator-test:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 45
    env:
      ANDROID_HOME: /data/data/com.termux/files/home/android-sdk
      ANDROID_SDK_ROOT: /data/data/com.termux/files/home/android-sdk
      JAVA_HOME: /data/data/com.termux/files/usr/lib/jvm/java-21-openjdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1

      - name: Configure Android SDK path
        working-directory: android-app
        run: printf "sdk.dir=%s\\n" "$ANDROID_HOME" > local.properties

      - name: Build debug APK and Android test APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          bash ./gradlew \
            -Pandroid.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2 \
            -Dorg.gradle.workers.max=2 \
            assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Install Ramus CLI
        run: |
          rm -rf "$RUNNER_TEMP/ramus-cli"
          mkdir -p "$RUNNER_TEMP/ramus-cli"
          cd "$RUNNER_TEMP/ramus-cli"
          npm init -y >/dev/null 2>&1
          npm install --no-fund --no-audit ramus-cli@0.1.13
          echo "RAMUS_CLI=$RUNNER_TEMP/ramus-cli/node_modules/ramus-cli/dist/main.js" >> "$GITHUB_ENV"

      - name: Run cloud Android smoke test with Ramus
        env:
          RAMUS_APK: ${{ github.workspace }}/android-app/app/build/outputs/apk/debug/app-debug.apk
          RAMUS_API_KEY: ${{ secrets.RAMUS_API_KEY }}
        run: node scripts/ramus-smoke.mjs

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LudoMadagascar-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload Ramus screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ramus-android-evidence
          path: ramus-screen.jpg
          if-no-files-found: warn

      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-test-reports
          path: android-app/app/build/reports/
          if-no-files-found: warn
