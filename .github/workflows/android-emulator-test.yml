name: Android UI Smoke (Legacy Termux + Ramus, Manual Only)
# Premium landscape visual/gameplay validation gate

on:
  # Manual fallback only; pull requests use the hosted Android emulator workflow.
  workflow_dispatch:

jobs:
  emulator-test:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 35
    concurrency:
      group: ramus-${{ github.ref }}
      cancel-in-progress: true
    env:
      ANDROID_HOME: /data/data/com.termux/files/home/android-sdk
      ANDROID_SDK_ROOT: /data/data/com.termux/files/home/android-sdk
      JAVA_HOME: /data/data/com.termux/files/usr/lib/jvm/java-21-openjdk
    steps:
      - name: Checkout source from GitHub
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true
          path: _runs/${{ github.run_id }}

      - name: Verify and repair checked-out sources
        working-directory: ${{ github.workspace }}/_runs/${{ github.run_id }}
        run: |
          set -eu
          git reset --hard "$GITHUB_SHA"
          git clean -fdx
          # Rehydrate the exact tracked tree from Git's object database. This protects the
          # single self-hosted runner from a previously interrupted job leaving a partial tree.
          git archive "$GITHUB_SHA" | tar -xf - -C "${{ github.workspace }}/_runs/${{ github.run_id }}"
          test -f android-app/settings.gradle.kts
          test -f android-app/gradlew
          test -f android-app/build.gradle.kts

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          cat > "$ANDROID_HOME/licenses/android-sdk-license" <<'EOF'
          8933bad161af4178b1185d1a37fbf41ea5269c55
          d56f5187479451eabf01fb78af6dfcb131a6481e
          24333f8a63b6825ea9c5514f83c2829b004d1fee
          EOF

      - name: Configure Android SDK
        working-directory: ${{ github.workspace }}/_runs/${{ github.run_id }}/android-app
        run: printf "sdk.dir=%s\n" "$ANDROID_HOME" > local.properties
      - name: Use Termux Node
        run: |
          set -eu
          mkdir -p "$HOME/.ci-node-bin"
          cat > "$HOME/.ci-node-bin/node" <<'EOF'
          #!/data/data/com.termux/files/usr/bin/sh
          export LD_LIBRARY_PATH=/data/data/com.termux/files/usr/lib
          exec /data/data/com.termux/files/usr/bin/node "$@"
          EOF
          cat > "$HOME/.ci-node-bin/npm" <<'EOF'
          #!/data/data/com.termux/files/usr/bin/sh
          export LD_LIBRARY_PATH=/data/data/com.termux/files/usr/lib
          exec /data/data/com.termux/files/usr/bin/node /data/data/com.termux/files/usr/bin/npm "$@"
          EOF
          cat > "$HOME/.ci-node-bin/npx" <<'EOF'
          #!/data/data/com.termux/files/usr/bin/sh
          export LD_LIBRARY_PATH=/data/data/com.termux/files/usr/lib
          exec /data/data/com.termux/files/usr/bin/node /data/data/com.termux/files/usr/bin/npx "$@"
          EOF
          chmod +x "$HOME/.ci-node-bin/node" "$HOME/.ci-node-bin/npm" "$HOME/.ci-node-bin/npx"
          echo "PATH=$HOME/.ci-node-bin:/data/data/com.termux/files/usr/bin:$PATH" >> "$GITHUB_ENV"
      - name: Configure ARM64 AAPT2
        working-directory: ${{ github.workspace }}/_runs/${{ github.run_id }}
        run: |
          HOME=/data/data/com.termux/files/home bash scripts/setup-termux-aapt2.sh
          printf 'AAPT2_WRAPPER=/data/data/com.termux/files/home/.local/bin/aapt2\n' >> "$GITHUB_ENV"
      - name: Build debug APK for Ramus
        working-directory: ${{ github.workspace }}/_runs/${{ github.run_id }}/android-app
        run: |
          set -eu
          chmod +x gradlew
          bash ./gradlew -Pandroid.aapt2FromMavenOverride="$AAPT2_WRAPPER" -PREOWN_PROJECT_ID="${{ secrets.REOWN_PROJECT_ID }}" --no-daemon --no-parallel -Dorg.gradle.workers.max=1 assembleDebug assembleDebugAndroidTest --console=plain --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: Audit Android source policy and 3D assets
        working-directory: ${{ github.workspace }}/_runs/${{ github.run_id }}
        run: |
          set -eu
          python3 scripts/android-release-audit.py
          export LD_LIBRARY_PATH="/data/data/com.termux/files/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          /data/data/com.termux/files/usr/bin/node scripts/check-3d-assets.mjs
          /data/data/com.termux/files/usr/bin/node scripts/check-3d-optimization.mjs
          /data/data/com.termux/files/usr/bin/node scripts/check-apk-3d-asset.mjs android-app/app/build/outputs/apk/debug/app-debug.apk
          python3 scripts/android-release-audit.py android-app/app/build/outputs/apk/debug/app-debug.apk
      - name: Install Ramus CLI
        working-directory: ${{ github.workspace }}/_runs/${{ github.run_id }}
        run: |
          set -eu
          rm -rf "$RUNNER_TEMP/ramus-cli"
          mkdir -p "$RUNNER_TEMP/ramus-cli"
          curl -fsSL https://registry.npmjs.org/ramus-cli/-/ramus-cli-0.1.13.tgz -o "$RUNNER_TEMP/ramus-cli/ramus-cli.tgz"
          tar -xzf "$RUNNER_TEMP/ramus-cli/ramus-cli.tgz" -C "$RUNNER_TEMP/ramus-cli"
          test -f "$RUNNER_TEMP/ramus-cli/package/dist/main.js"
          echo "RAMUS_CLI=$RUNNER_TEMP/ramus-cli/package/dist/main.js" >> "$GITHUB_ENV"
      - name: Run cloud Android smoke test with Ramus
        env:
          RAMUS_APK: ${{ github.workspace }}/_runs/${{ github.run_id }}/android-app/app/build/outputs/apk/debug/app-debug.apk
          RAMUS_API_KEY: ${{ secrets.RAMUS_API_KEY }}
          RAMUS_CAPTURE: "1"
        run: |
          set -o pipefail
          timeout -k 10s 900s node scripts/ramus-smoke.mjs 2>&1 | tee ramus-smoke.log
      - name: Save Ramus visual evidence locally
        if: always()
        run: tar -czf "$HOME/LudoMada-ramus-evidence.tgz" ramus-evidence ramus-smoke.log 2>/dev/null || true
      - name: Package Ramus visual evidence
        if: always()
        run: |
          set -eu
          mkdir -p ramus-evidence
          tar -czf "ludomada-ramus-visual-${{ github.run_id }}.tgz" ramus-evidence ramus-smoke.log 2>/dev/null || tar -czf "ludomada-ramus-visual-${{ github.run_id }}.tgz" ramus-evidence
          test -s "ludomada-ramus-visual-${{ github.run_id }}.tgz"
      - name: Upload Ramus visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ludomada-ramus-visual-${{ github.run_id }}
          path: _runs/${{ github.run_id }}/ludomada-ramus-visual-${{ github.run_id }}.tgz
          if-no-files-found: error
          retention-days: 7
      - name: Save verified debug APK locally
        if: success()
        run: |
          set -eu
          cp android-app/app/build/outputs/apk/debug/app-debug.apk /sdcard/Download/LudoMada-Ramus-verified-debug.apk
          sha256sum android-app/app/build/outputs/apk/debug/app-debug.apk | tee /sdcard/Download/LudoMada-Ramus-verified-debug.sha256
