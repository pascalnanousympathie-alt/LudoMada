name: Mada Commander production runtime watch

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/mada-commander-runtime-watch.yml"
      - "tools/mada-commander-public-mcp/scripts/smoke-production.mjs"

permissions:
  contents: read

concurrency:
  group: mada-commander-runtime-watch
  cancel-in-progress: true

jobs:
  production-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production health, MCP protocol, tool catalog and OAuth start
        env:
          MADA_BASES: "https://mada-commander-public-mcp.vercel.app,https://mada-commander-public-mcp-auto.vercel.app"
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";

          const targets = [
            { base: "https://mada-commander-public-mcp.vercel.app", ready: true },
            // The Git-linked auto project is intentionally fail-closed; it has no production DB/OAuth secrets.
            { base: "https://mada-commander-public-mcp-auto.vercel.app", ready: false }
          ];
          const expectedTools = [
            "mada_agent_status", "mada_list_projects", "mada_run_diagnostics", "mada_job_status",
            "mada_connection_help", "mada_workspace_list", "mada_workspace_read", "mada_workspace_write",
            "mada_run_task", "mada_run_command", "mada_run_shell", "mada_opera_status",
            "mada_opera_tabs", "mada_opera_navigate", "mada_opera_action", "mada_mcp_integrations",
            "mada_mcp_tools", "mada_mcp_call"
          ];
          const failures = [];
          const check = async (label, action) => {
            try { await action(); console.log("PASS " + label); }
            catch (error) { failures.push(label); console.error("FAIL " + label + ": " + String(error?.message || error)); }
          };
          const get = async (base, route) => fetch(new URL(route, base), {
            redirect: "manual",
            cache: "no-store",
            signal: AbortSignal.timeout(10000)
          });
          const rpc = async (base, message) => fetch(new URL("/mcp", base), {
            method: "POST",
            headers: { "content-type": "application/json", accept: "application/json, text/event-stream" },
            body: JSON.stringify(message),
            cache: "no-store",
            signal: AbortSignal.timeout(10000)
          });

          for (const target of targets) {
            const base = target.base;
            const label = new URL(base).hostname;
            await check(label + " " + (target.ready ? "ready" : "fail-closed") + " health", async () => {
              const response = await get(base, "/api/health");
              const health = await response.json();
              if (target.ready) {
                assert.equal(response.status, 200, "health HTTP " + response.status);
                assert.equal(health.ready, true, "health.ready was false");
                assert.equal(health.checks?.databaseConfigured, true, "database is not configured");
                assert.equal(health.checks?.schemaReady, true, "database schema is not ready");
                assert.equal(health.checks?.googleOAuthConfigured, true, "Google OAuth configuration is incomplete");
                assert.equal(health.checks?.oauthClientModeConfigured, true, "OAuth client mode is not configured");
                assert.equal(health.checks?.oauthRedirectAllowlistConfigured, true, "OAuth redirect policy is not configured");
              } else {
                assert.equal(response.status, 503, "unconfigured auto deployment must remain fail-closed");
                assert.equal(health.ready, false, "unconfigured auto deployment must not claim readiness");
                assert.ok(health.checks?.databaseConfigured === false || health.checks?.googleOAuthConfigured === false,
                  "fail-closed health must identify a missing prerequisite");
              }
            });
            await check(label + " MCP initialize and tools/list", async () => {
              const initialized = await rpc(base, {
                jsonrpc: "2.0", id: 1, method: "initialize",
                params: { protocolVersion: "2025-06-18", capabilities: {}, clientInfo: { name: "mada-runtime-canary", version: "1.0" } }
              });
              assert.equal(initialized.status, 200, "initialize HTTP " + initialized.status);
              const initBody = await initialized.json();
              assert.equal(initBody.result?.serverInfo?.name, "mada-commander-public");
              const listed = await rpc(base, { jsonrpc: "2.0", id: 2, method: "tools/list", params: {} });
              assert.equal(listed.status, 200, "tools/list HTTP " + listed.status);
              const body = await listed.json();
              assert.deepEqual(body.result?.tools?.map(tool => tool.name), expectedTools);
            });
            await check(label + " Google OAuth path", async () => {
              if (target.ready) {
                // Use a deliberately invalid MCP authorization transaction so the canary
                // exercises config/rate-limit/database reads without creating OAuth state rows.
                const response = await get(base, "/oauth/google/start?purpose=mcp&transaction_id=runtime-watch-invalid");
                assert.equal(response.status, 400, "expected invalid transaction response, got HTTP " + response.status);
                const body = await response.json();
                assert.equal(body.error, "invalid_request", "OAuth preflight returned an unexpected error");
                assert.match(body.error_description || "", /authorization request expired/i);
              } else {
                // The auto deployment is deliberately unconfigured and must reject sign-in,
                // rather than return an internal error or accidentally claim OAuth is ready.
                const response = await get(base, "/oauth/google/start?purpose=dashboard");
                assert.equal(response.status, 503, "unconfigured OAuth must fail closed, got HTTP " + response.status);
                const body = await response.json();
                assert.equal(body.error, "service_not_configured");
              }
            });
          }
          if (failures.length) {
            console.error("Runtime watch failed " + failures.length + " check(s): " + failures.join(", "));
            process.exitCode = 1;
          } else {
            console.log("Runtime watch passed for " + targets.length + " production deployment modes.");
          }
          NODE
