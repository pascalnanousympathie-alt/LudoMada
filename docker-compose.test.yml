services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ludomada_test
      POSTGRES_PASSWORD: ludomada_test
      POSTGRES_DB: ludomada_test
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ludomada_test -d ludomada_test"]
      interval: 3s
      timeout: 3s
      retries: 20
