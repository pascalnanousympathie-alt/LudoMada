config:
  target: "http://127.0.0.1:3000"

  phases:
    - duration: 10
      arrivalRate: 20
      name: "Production baseline"

  variables:
    gameId: "{{ $processEnvironment.LOADTEST_GAME_ID }}"
    accessToken: "{{ $processEnvironment.LOADTEST_TOKEN2 }}"

scenarios:
  - name: "Production state"
    flow:
      - get:
          url: "/api/games/{{ gameId }}/state"
          headers:
            Authorization: "Bearer {{ accessToken }}"
