config:
  target: "http://127.0.0.1:3101"
  http:
    timeout: 15
    # Artillery otherwise creates a new Agent for each virtual user.
    # A shared keep-alive pool prevents ephemeral-port exhaustion at high RPS.
    pool: 4096
  payload:
    path: "./capacity-fixtures.csv"
    fields:
      - "gameId"
      - "accessToken"
    order: random
    skipHeader: true
  phases:
    - duration: 10
      arrivalRate: 250
      rampTo: 1000
      name: "Warm-up: 250 to 1k authenticated state reads/sec"
    - duration: 10
      arrivalRate: 1000
      rampTo: 2500
      name: "Ramp: 1k to 2.5k state reads/sec"
    - duration: 10
      arrivalRate: 2500
      rampTo: 5000
      name: "Ramp: 2.5k to 5k state reads/sec"
    - duration: 10
      arrivalRate: 5000
      rampTo: 10000
      name: "Ramp: 5k to 10k state reads/sec"
    - duration: 30
      arrivalRate: 10000
      name: "Steady state: 10k authenticated state reads/sec"
  plugins:
    ensure:
      conditions:
        - expression: "http.request_rate >= 10000"
        - expression: "http.response_time.p95 <= 250"
        - expression: "http.response_time.p99 <= 500"
        - expression: "vusers.failed / vusers.created <= 0.001"
        - expression: "http.codes.200 == http.responses"

scenarios:
  - name: "Participant-authorized authoritative game-state read"
    flow:
      - get:
          url: "/api/games/{{ gameId }}/state"
          headers:
            Authorization: "Bearer {{ accessToken }}"
