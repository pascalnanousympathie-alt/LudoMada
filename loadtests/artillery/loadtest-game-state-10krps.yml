config:
  target: "http://127.0.0.1:3101"
  http:
    timeout: 15
  payload:
    path: "./capacity-fixtures.csv"
    fields:
      - "gameId"
      - "accessToken"
    order: random
    skipHeader: true
  phases:
    - duration: 5
      arrivalRate: 1000
      rampTo: 10000
      name: "Warm-up ramp: 1k to 10k authenticated state reads/sec"
    - duration: 30
      arrivalRate: 10000
      name: "Steady state: 10k authenticated state reads/sec"
  plugins:
    ensure:
      thresholds:
        - "http.response_time.p95": 250
        - "http.response_time.p99": 500
      conditions:
        - expression: "http.request_rate >= 9000"
          strict: true
        - expression: "(vusers.failed / vusers.created) * 100 <= 0.1"
          strict: true

scenarios:
  - name: "Participant-authorized authoritative game-state read"
    flow:
      - get:
          url: "/api/games/{{ gameId }}/state"
          headers:
            Authorization: "Bearer {{ accessToken }}"
