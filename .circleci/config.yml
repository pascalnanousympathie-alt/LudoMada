version: 2.1

jobs:
  source-quality:
    docker:
      - image: cimg/node:22
    steps:
      - checkout
      - run:
          name: Premium material calibration gate
          command: node scripts/audit-material-calibration.mjs --strict
      - run:
          name: Validate production 3D asset manifest and packaged source assets
          command: node scripts/check-3d-assets.mjs
      - run:
          name: Validate GLB transforms and runtime loader contract
          command: node scripts/check-glb-runtime-transform.mjs
      - run:
          name: Validate wallet touch target contract
          command: node scripts/check-ramus-wallet-hitbox.mjs

  android-build:
    docker:
      - image: cimg/android:2026.08
    resource_class: medium
    steps:
      - checkout
      - restore_cache:
          keys:
            - ludomada-gradle-v1-{{ checksum "android-app/gradle/wrapper/gradle-wrapper.properties" }}
            - ludomada-gradle-v1-
      - run:
          name: Unit tests and Android APK compilation
          command: |
            set -euo pipefail
            cd android-app
            chmod +x gradlew
            gradle_args=()
            if [ -n "${REOWN_PROJECT_ID:-}" ]; then
              gradle_args+=("-PREOWN_PROJECT_ID=${REOWN_PROJECT_ID}")
            fi
            ./gradlew "${gradle_args[@]}" --no-daemon --stacktrace test assembleDebug assembleDebugAndroidTest
            test -s app/build/outputs/apk/debug/app-debug.apk
      - save_cache:
          key: ludomada-gradle-v1-{{ checksum "android-app/gradle/wrapper/gradle-wrapper.properties" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
      - store_test_results:
          path: android-app/app/build/test-results
      - store_artifacts:
          path: android-app/app/build/outputs/apk
          destination: android-apks
      - persist_to_workspace:
          root: .
          paths:
            - android-app/app/build/outputs/apk/debug/app-debug.apk

  apk-asset-contract:
    docker:
      - image: cimg/node:22
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Verify shipped 3D assets inside the APK
          command: |
            node scripts/check-apk-3d-asset.mjs android-app/app/build/outputs/apk/debug/app-debug.apk

workflows:
  ci-fallback:
    jobs:
      - source-quality
      - android-build
      - apk-asset-contract:
          requires:
            - android-build
