server {
    listen 80;
    listen [::]:80;

    server_name api.ludomada.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        # Preserve HTTP/1.1 upstream streaming on Nginx versions whose default is 1.0.
        # Do not forward Upgrade or Connection: upgrade; this API uses authenticated SSE.
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # No Upgrade or Connection headers are forwarded: this API uses HTTP/JSON only.

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
